<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사랑하는 수하의 성장기록</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: #f9fafb;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 30px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 27px;
}

#clock {
  color: #cbd5e1;
  font-size: 15px;
}

#tabs {
  display: flex;
  gap: 10px;
  padding: 12px 30px 20px;
}

#tabs button,
.controls button {
  border: 0;
  border-radius: 9px;
  padding: 11px 19px;
  background: #374151;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

#tabs button.active {
  background: #2563eb;
}

.layout {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
  padding: 0 30px 25px;
  height: calc(100vh - 125px);
}

.viewer,
.sidebar {
  background: #1f2937;
  border-radius: 15px;
  padding: 20px;
  min-height: 0;
  overflow: hidden;
}

#media {
  height: 58%;
  min-height: 180px;
  background: #0f172a;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #94a3b8;
}

#media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#title {
  font-size: 22px;
  margin: 17px 0 7px;
}

#meta {
  font-size: 13px;
  color: #9ca3af;
}

#body {
  margin-top: 12px;
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-y: auto;
  max-height: 15%;
  color: #e5e7eb;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

#status {
  margin-top: 12px;
  color: #9ca3af;
  font-size: 13px;
}

.sidebar h2 {
  margin: 0 0 15px;
  font-size: 19px;
}

#list {
  overflow-y: auto;
  height: calc(100% - 35px);
}

.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px;
  margin-bottom: 8px;
  border: 1px solid #374151;
  border-radius: 9px;
  background: #111827;
  color: #e5e7eb;
  cursor: pointer;
  font-size: 14px;
}

.item.selected {
  border-color: #3b82f6;
  background: #1e3a8a;
}

.item small {
  display: block;
  margin-top: 5px;
  color: #9ca3af;
}

@media (max-width: 700px) {
  header {
    padding: 15px;
  }

  h1 {
    font-size: 20px;
  }

  #tabs {
    padding: 10px 15px;
    gap: 5px;
  }

  #tabs button {
    padding: 9px 12px;
  }

  .layout {
    display: flex;
    flex-direction: column;
    height: auto;
    padding: 0 15px;
  }

  .viewer {
    min-height: 550px;
  }

  .sidebar {
    height: 400px;
  }
}
</style>
</head>

<body>

<header>
  <h1>사랑하는 수하의 성장기록</h1>
  <div id="clock"></div>
</header>

<nav id="tabs">
  <button data-cat="전체">전체</button>
  <button data-cat="알림장">알림장</button>
  <button data-cat="앨범" class="active">앨범</button>
  <button data-cat="공지">공지</button>
</nav>

<div class="layout">

  <section class="viewer">

    <div id="media">기록을 불러오는 중...</div>

    <h2 id="title">불러오는 중</h2>

    <div id="meta"></div>

    <div id="body"></div>

    <div class="controls">
      <button id="prev">이전</button>
      <button id="pause">일시정지</button>
      <button id="next">다음</button>
    </div>

    <div id="status">데이터 불러오는 중...</div>

  </section>

  <aside class="sidebar">

    <h2 id="listTitle">최근 기록</h2>

    <div id="list"></div>

  </aside>

</div>

<script>
const $ = id => document.getElementById(id);

let all = [];
let items = [];
let idx = 0;
let cat = "앨범";
let paused = false;

let detailRequest = 0;
let timer = null;

// 전체 기록 페이지 단위 조회
async function loadAllPages() {

  const records = [];
  let cursor = null;

  do {

    let url = "/api/data";

    if (cursor) {
      url += "?cursor=" + encodeURIComponent(cursor);
    }

    const response = await fetch(url);

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "기록 조회 실패");
    }

    records.push(...(data.items || []));

    cursor = data.has_more
      ? data.next_cursor
      : null;

    $("status").textContent =
      "기록 불러오는 중... " + records.length + "개";

  } while (cursor);

  return records;
}

// 상세 기록 조회
async function loadDetail(pageId) {

  const response = await fetch(
    "/api/detail?id=" + encodeURIComponent(pageId)
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "상세 기록 조회 실패");
  }

  return data;
}

// 목록 그리기
function renderList() {

  const list = $("list");

  list.replaceChildren();

  items.forEach((x, i) => {

    const button = document.createElement("button");

    button.className =
      "item" + (i === idx ? " selected" : "");

    button.appendChild(
      document.createTextNode(x.title || "제목 없음")
    );

    const small = document.createElement("small");

    small.textContent =
      [x.date, x.category].filter(Boolean).join(" · ");

    button.appendChild(small);

    button.onclick = () => {

      idx = i;
      paused = true;

      $("pause").textContent = "재생";

      render();

    };

    list.appendChild(button);

  });

  $("listTitle").textContent =
    cat === "전체" ? "전체 기록" : cat + " 기록";

}

// 현재 기록 표시
async function render() {

  if (!items.length) {

    $("media").textContent = "표시할 기록이 없습니다";
    $("title").textContent = "기록 없음";
    $("meta").textContent = "";
    $("body").textContent = "";
    $("list").textContent = "기록이 없습니다";

    return;
  }

  const p = items[idx];

  const requestId = ++detailRequest;

  $("title").textContent = p.title || "제목 없음";

  $("meta").textContent =
    [p.date, p.category].filter(Boolean).join(" · ");

  $("media").textContent = "사진 불러오는 중...";
  $("body").textContent = "내용 불러오는 중...";

  renderList();

  try {

    const detail = await loadDetail(p.id);

    // 이전 요청이 늦게 도착한 경우 무시
    if (requestId !== detailRequest) return;

    $("body").textContent = detail.text || "";

    const media = $("media");

    media.replaceChildren();

    if (detail.images && detail.images.length) {

      const img = document.createElement("img");

      img.src = detail.images[0];
      img.alt = p.title || "수하의 앨범 사진";

      img.onerror = () => {
        media.textContent = "사진을 불러올 수 없습니다";
      };

      media.appendChild(img);

    } else {

      media.textContent = "사진 없음";

    }

  } catch (error) {

    if (requestId !== detailRequest) return;

    $("media").textContent = "내용을 불러오지 못했습니다";
    $("body").textContent = error.message;

  }

}

// 카테고리 선택
function select(c) {

  cat = c;

  if (c === "전체") {

    items = all;

  } else {

    items = all.filter(x => x.category === c);

  }

  if (c === "앨범" && items.length) {

    idx = Math.floor(Math.random() * items.length);

    paused = false;

    $("pause").textContent = "일시정지";

  } else {

    idx = 0;

    paused = true;

    $("pause").textContent = "재생";

  }

  document.querySelectorAll("#tabs button").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.cat === c
    );

  });

  render();

  $("status").textContent =
    c === "앨범"
      ? "앨범 랜덤 재생 중 · " + items.length + "개"
      : c + " 카테고리 · " + items.length + "개";

}

// 이전 기록
function previous() {

  if (!items.length) return;

  idx = (idx - 1 + items.length) % items.length;

  render();

}

// 다음 기록
function next() {

  if (!items.length) return;

  idx = (idx + 1) % items.length;

  render();

}

// 재생 / 일시정지
function togglePause() {

  paused = !paused;

  $("pause").textContent =
    paused ? "재생" : "일시정지";

}

// 앨범 자동 전환
function startTimer() {

  if (timer) clearInterval(timer);

  timer = setInterval(() => {

    if (
      cat === "앨범" &&
      !paused &&
      items.length > 1
    ) {

      let nextIndex;

      do {
        nextIndex = Math.floor(Math.random() * items.length);
      } while (nextIndex === idx);

      idx = nextIndex;

      render();

    }

  }, 45000);

}

// 데이터 불러오기
async function load() {

  try {

    $("status").textContent = "전체 기록 조회 중...";

    all = await loadAllPages();

    $("status").textContent =
      "전체 " + all.length + "개 기록 조회 완료";

    select("앨범");

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

    $("media").textContent = "데이터를 불러오지 못했습니다";

  }

}

// 이벤트 연결
document.querySelectorAll("#tabs button").forEach(button => {

  button.onclick = () => select(button.dataset.cat);

});

$("prev").onclick = previous;
$("next").onclick = next;
$("pause").onclick = togglePause;

// 시계
function updateClock() {

  $("clock").textContent =
    new Date().toLocaleString("ko-KR");

}

updateClock();

setInterval(updateClock, 1000);

startTimer();

load();

</script>

</body>
</html>
