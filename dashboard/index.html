<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사랑하는 수하의 성장기록</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #f5f1e8;
  color: #493f34;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* 상단 */
header {
  height: 65px;
  padding: 12px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 25px;
  color: #514638;
  letter-spacing: -0.5px;
}

#clock {
  color: #8c806e;
  font-size: 14px;
}

/* 탭 */
#tabs {
  display: flex;
  gap: 9px;
  padding: 5px 25px 15px;
  flex-wrap: wrap;
}

#tabs button,
.controls button {
  border: 1px solid #e1d9ca;
  border-radius: 10px;
  padding: 10px 18px;
  background: #e9e3d7;
  color: #665b4b;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

#tabs button:hover,
.controls button:hover {
  background: #dce5d7;
}

#tabs button.active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#tabs button[data-cat="추억 랜덤"] {
  background: #d6c18d;
  border-color: #d6c18d;
  color: #594b2f;
}

#tabs button[data-cat="추억 랜덤"].active {
  background: #a88c4c;
  border-color: #a88c4c;
  color: white;
}

#tabs button[data-cat="성장 추억 여행"] {
  background: #dce6d8;
  border-color: #dce6d8;
  color: #52664c;
}

#tabs button[data-cat="성장 추억 여행"].active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#tabs button[data-cat="오늘의 추억"] {
  background: #e8d8d9;
  border-color: #e8d8d9;
  color: #785b62;
}

#tabs button[data-cat="오늘의 추억"].active {
  background: #bd929e;
  border-color: #bd929e;
  color: white;
}

/* 메인 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 3.5fr) minmax(220px, 1fr);
  gap: 16px;
  padding: 0 25px 18px;
  height: calc(100% - 125px);
  min-height: 0;
}

/* 좌우 패널 */
.viewer,
.sidebar {
  background: #fffdf8;
  border: 1px solid #e9e1d4;
  border-radius: 17px;
  padding: 16px;
  min-height: 0;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(100, 83, 55, .06);
}

.viewer {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* 사진 갤러리 */
#media {
  position: relative;
  flex: 0 0 58%;
  min-height: 220px;
  max-height: 560px;
  background: #eee8dc;
  border: 1px solid #e7dfd1;
  border-radius: 13px;
  overflow: hidden;
  color: #998d7b;
}

/* 갤러리 그리드 */
#gallery {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 9px;
  padding: 10px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

/* 사진 개수별 레이아웃 */
#gallery.count-1 {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

#gallery.count-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: 1fr;
}

#gallery.count-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: 1fr;
}

#gallery.count-4 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

#gallery.count-5,
#gallery.count-6 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

/* 사진 카드 */
.photo-card {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #e5ddcf;
  border-radius: 10px;
  background: #faf8f2;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-in;
  transition: transform .2s, box-shadow .2s;
}

.photo-card:hover {
  transform: scale(1.012);
  box-shadow: 0 3px 12px rgba(70, 60, 40, .12);
}

.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.photo-card::after {
  content: "확대";
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 4px 8px;
  border-radius: 7px;
  background: rgba(65, 60, 48, .65);
  color: white;
  font-size: 11px;
  opacity: 0;
  transition: opacity .2s;
}

.photo-card:hover::after {
  opacity: 1;
}

/* 페이지 이동 버튼 */
.gallery-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 58px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 10px;
  background: rgba(70, 75, 60, .65);
  color: white;
  font-size: 29px;
  cursor: pointer;
  z-index: 5;
}

.gallery-prev {
  left: 10px;
}

.gallery-next {
  right: 10px;
}

.gallery-nav:hover {
  background: rgba(93, 119, 83, .9);
}

/* 사진 페이지 표시 */
#photoCount {
  position: absolute;
  bottom: 12px;
  right: 13px;
  background: rgba(65, 60, 48, .78);
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 6;
  pointer-events: none;
}

/* 사진 없음 */
.no-photo {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #998d7b;
}

/* 제목과 날짜 */
#title {
  font-size: 21px;
  line-height: 1.4;
  margin: 3px 0 0;
  color: #514638;
  flex-shrink: 0;
}

#meta {
  font-size: 13px;
  color: #9a8d7b;
  flex-shrink: 0;
}

/* 본문 */
#body {
  flex: 1;
  min-height: 60px;
  margin: 0;
  padding: 7px 5px 7px 0;
  white-space: pre-wrap;
  line-height: 1.75;
  font-size: 15px;
  overflow-y: auto;
  overflow-wrap: anywhere;
  color: #51483e;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

/* 하단 버튼 */
.controls {
  display: flex;
  gap: 9px;
  flex-shrink: 0;
}

.controls button {
  min-width: 65px;
  padding: 11px 17px;
  background: #e8e4d9;
}

.controls button:active {
  background: #82977a;
  color: white;
}

#status {
  color: #9a8d7b;
  font-size: 12px;
  flex-shrink: 0;
}

/* 오른쪽 목록 */
.sidebar {
  display: flex;
  flex-direction: column;
  background: #faf8f1;
}

.sidebar h2 {
  margin: 2px 0 14px;
  font-size: 18px;
  color: #5b5042;
  flex-shrink: 0;
}

#list {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px;
  margin-bottom: 8px;
  border: 1px solid #e8e1d5;
  border-radius: 10px;
  background: #fffdf9;
  color: #574d41;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.5;
  transition: background .2s;
  overflow-wrap: anywhere;
}

.item:hover {
  background: #f0f2e9;
}

.item.selected {
  border-color: #91a586;
  background: #e8eee2;
  color: #43563c;
}

.item small {
  display: block;
  margin-top: 5px;
  color: #9b8f7e;
}

/* 확대 모달 */
#lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(25, 25, 22, .94);
  padding: 55px 70px;
}

#lightbox.open {
  display: flex;
}

#lightboxImage {
  max-width: 94%;
  max-height: 88%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 5px;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: pinch-zoom;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 24px;
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 30px;
  cursor: pointer;
  z-index: 3;
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 68px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 36px;
  cursor: pointer;
  z-index: 3;
}

.lightbox-prev {
  left: 18px;
}

.lightbox-next {
  right: 18px;
}

.lightbox-close:hover,
.lightbox-nav:hover {
  background: rgba(255,255,255,.3);
}

#lightboxCount {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 15px;
  border-radius: 20px;
  background: rgba(255,255,255,.16);
  color: white;
  font-size: 14px;
}

/* 태블릿 세로 화면 */
@media (max-width: 800px) {

  body {
    overflow: auto;
  }

  header {
    height: auto;
    padding: 15px;
  }

  h1 {
    font-size: 20px;
  }

  #tabs {
    padding: 10px 15px;
    gap: 6px;
  }

  #tabs button {
    padding: 9px 11px;
  }

  .layout {
    display: flex;
    flex-direction: column;
    height: auto;
    padding: 0 15px 15px;
  }

  .viewer {
    min-height: 850px;
  }

  #media {
    flex-basis: auto;
    height: 480px;
    flex-shrink: 0;
  }

  #body {
    min-height: 180px;
  }

  .sidebar {
    height: 450px;
  }

  #lightbox {
    padding: 55px 45px;
  }

  #lightboxImage {
    max-width: 100%;
    max-height: 85%;
  }

  .lightbox-prev {
    left: 5px;
  }

  .lightbox-next {
    right: 5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>사랑하는 수하의 성장기록</h1>
  <div id="clock"></div>
</header>

<nav id="tabs">
  <button data-cat="전체">전체</button>
  <button data-cat="추억 랜덤">⭐ 추억 랜덤</button>
  <button data-cat="성장 추억 여행">🌱 성장 추억 여행</button>
  <button data-cat="오늘의 추억">📅 오늘의 추억</button>
  <button data-cat="알림장">알림장</button>
  <button data-cat="앨범">앨범</button>
  <button data-cat="공지">공지</button>
</nav>

<div class="layout">

  <section class="viewer">

    <div id="media">
      <div class="no-photo">기록을 불러오는 중...</div>
    </div>

    <h2 id="title">불러오는 중</h2>

    <div id="meta"></div>

    <div id="body"></div>

    <div class="controls">
      <button id="prev">이전</button>
      <button id="pause">일시정지</button>
      <button id="next">다음</button>
    </div>

    <div id="status">데이터 불러오는 중...</div>

  </section>

  <aside class="sidebar">

    <h2 id="listTitle">추억 랜덤</h2>

    <div id="list"></div>

  </aside>

</div>

<!-- 사진 확대 모달 -->
<div id="lightbox">

  <button class="lightbox-close" id="lightboxClose">×</button>

  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>

  <img id="lightboxImage" alt="수하의 성장기록 사진">

  <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>

  <div id="lightboxCount"></div>

</div>

<script>
const $ = id => document.getElementById(id);

let all = [];
let items = [];
let idx = 0;

let cat = "추억 랜덤";
let paused = false;

let detailRequest = 0;

let recordTimer = null;
let pageTimer = null;

let currentImages = [];

let photoPageIndex = 0;
let totalPhotoPages = 0;

let lightboxOpen = false;
let lightboxIndex = 0;

// 성장 추억 여행 상태
let journeyMode = false;
let journeyPhotos = [];
let journeyIndex = 0;
let journeyTimer = null;
let journeyLoadToken = 0;
let journeyPhase = "어린이집";

// 자동 재생 대상 카테고리
function isAutoCategory() {
  return [
    "앨범",
    "알림장",
    "추억 랜덤",
    "성장 추억 여행",
    "오늘의 추억"
  ].includes(cat);
}

// 타이머 정리
function clearTimers() {

  if (recordTimer) {
    clearTimeout(recordTimer);
    recordTimer = null;
  }

  if (pageTimer) {
    clearTimeout(pageTimer);
    pageTimer = null;
  }

  if (journeyTimer) {
    clearTimeout(journeyTimer);
    journeyTimer = null;
  }

}

// 전체 기록 조회
async function loadAllPages() {

  const records = [];
  let cursor = null;

  do {

    let url = "/api/data";

    if (cursor) {
      url += "?cursor=" + encodeURIComponent(cursor);
    }

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "기록 조회 실패");
    }

    records.push(...(data.items || []));

    cursor = data.has_more
      ? data.next_cursor
      : null;

    $("status").textContent =
      "기록 불러오는 중... " + records.length + "개";

  } while (cursor);

  return records;
}

// 상세 기록 조회
async function loadDetail(pageId) {

  const response = await fetch(
    "/api/detail?id=" + encodeURIComponent(pageId)
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "상세 기록 조회 실패");
  }

  return data;
}

// 날짜 월일 추출
function getMonthDay(dateValue) {

  if (!dateValue) return "";

  const match = String(dateValue).match(
    /^\d{4}-(\d{2})-(\d{2})/
  );

  return match ? match[1] + "-" + match[2] : "";

}

// 추억 랜덤 대상
function getMemoryItems() {

  const albums = all.filter(x =>
    x.category === "앨범"
  );

  const oldNotices = all.filter(x =>
    x.category === "알림장" &&
    ["2022", "2023", "2024"].includes(
      String(x.date || "").substring(0, 4)
    )
  );

  return [...albums, ...oldNotices];

}

// 오늘의 추억
function getTodayItems() {

  const today = new Date();

  const monthDay =
    String(today.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(today.getDate()).padStart(2, "0");

  return all.filter(x =>
    getMonthDay(x.date) === monthDay
  );

}

// 목록 표시
function renderList() {

  const list = $("list");

  list.replaceChildren();

  if (journeyMode) {
    $("listTitle").textContent = "🌱 성장 추억 여행 · " + journeyPhase;

    journeyPhotos.forEach((photo, i) => {
      const button = document.createElement("button");
      button.className = "item" + (i === journeyIndex ? " selected" : "");
      button.appendChild(document.createTextNode(photo.title || "수하의 추억"));

      const small = document.createElement("small");
      small.textContent = [photo.date, photo.phase].filter(Boolean).join(" · ");
      button.appendChild(small);

      button.onclick = () => {
        journeyIndex = i;
        clearTimers();
        closeLightbox(false);
        renderJourneyCurrent();
        schedulePlayback();
      };

      list.appendChild(button);
    });
    return;
  }

  items.forEach((x, i) => {

    const button = document.createElement("button");

    button.className =
      "item" + (i === idx ? " selected" : "");

    button.appendChild(
      document.createTextNode(x.title || "제목 없음")
    );

    const small = document.createElement("small");

    small.textContent =
      [x.date, x.category].filter(Boolean).join(" · ");

    button.appendChild(small);

   button.onclick = () => {

  idx = i;

  clearTimers();

  closeLightbox(false);

  render();

};

    list.appendChild(button);

  });

  $("listTitle").textContent =
    cat === "추억 랜덤"
      ? "⭐ 추억 랜덤 기록"
      : cat === "오늘의 추억"
        ? "📅 오늘의 추억"
        : cat === "전체"
          ? "전체 기록"
          : cat + " 기록";

}


// 성장 추억 여행: 어린이집(알림장) → 유치원(앨범)
function getJourneyRecords(phase) {
  return all.filter(x => {
    const date = String(x.date || "").substring(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;

    if (phase === "어린이집") {
      return x.category === "알림장" &&
        date >= "2022-01-01" && date <= "2024-02-29";
    }

    return x.category === "앨범" &&
      date >= "2024-03-01" && date <= new Date().toISOString().substring(0, 10);
  });
}

async function loadJourneyPhotos(phase, token) {
  const records = getJourneyRecords(phase);
  const shuffled = [...records].sort(() => Math.random() - 0.5);
  // Notion API 호출량을 제한하기 위해 각 시기에서 최대 50개 기록을 표본 조회
  const sample = shuffled.slice(0, 50);
  const found = [];
  let cursor = 0;

  async function worker() {
    while (cursor < sample.length) {
      const record = sample[cursor++];
      try {
        const detail = await loadDetail(record.id);
        if (token !== journeyLoadToken) return;

        (detail.images || []).forEach((src, imageIndex) => {
          found.push({
            src,
            date: record.date || "",
            title: record.title || "수하의 추억",
            phase,
            imageIndex
          });
        });
      } catch (error) {
        console.warn("성장 추억 사진 조회 실패:", record.title, error);
      }
    }
  }

  await Promise.all(Array.from({ length: 4 }, () => worker()));
  if (token !== journeyLoadToken) return [];

  return found
    .sort(() => Math.random() - 0.5)
    .slice(0, 30)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

async function startJourney() {
  const token = ++journeyLoadToken;
  journeyMode = true;
  paused = false;
  journeyPhotos = [];
  journeyIndex = 0;
  journeyPhase = "어린이집";
  items = [];
  idx = 0;
  clearTimers();

  $("pause").textContent = "일시정지";
  $("title").textContent = "수하의 성장 추억을 준비하고 있어요";
  $("meta").textContent = "어린이집 시절 → 유치원 시절";
  $("body").textContent = "사진을 모으는 중입니다. 사진 수에 따라 잠시 걸릴 수 있어요.";
  $("media").innerHTML = '<div class="no-photo">추억 사진을 모으는 중...</div>';
  $("listTitle").textContent = "🌱 성장 추억 여행";
  $("list").textContent = "사진을 준비하고 있습니다...";
  $("status").textContent = "어린이집 시절 사진 조회 중...";

  const childcare = await loadJourneyPhotos("어린이집", token);
  if (token !== journeyLoadToken) return;

  const kindergarten = await loadJourneyPhotos("유치원", token);
  if (token !== journeyLoadToken) return;

  journeyPhotos = [...childcare, ...kindergarten];
  journeyIndex = 0;

  if (!journeyPhotos.length) {
    $("title").textContent = "추억 사진이 없습니다";
    $("meta").textContent = "";
    $("body").textContent = "해당 기간의 알림장·앨범 사진을 찾지 못했습니다.";
    $("media").innerHTML = '<div class="no-photo">표시할 사진이 없습니다</div>';
    $("list").textContent = "사진이 없습니다";
    $("status").textContent = "성장 추억 여행 사진 없음";
    return;
  }

  journeyPhase = journeyPhotos[0].phase;
  $("status").textContent =
    "어린이집 " + childcare.length + "장 · 유치원 " +
    kindergarten.length + "장 · 총 " + journeyPhotos.length + "장";
  renderJourneyCurrent();
  schedulePlayback();
}

// 성장 추억 여행: 시절별로 최대 6장씩 날짜순 표시
function getJourneyPageBounds(index) {
  const phase = journeyPhotos[index].phase;
  let start = index;
  while (start > 0 && journeyPhotos[start - 1].phase === phase) start--;
  let end = index + 1;
  while (end < journeyPhotos.length && journeyPhotos[end].phase === phase) end++;
  const pageStart = start + Math.floor((index - start) / 6) * 6;
  return { start: pageStart, end: Math.min(pageStart + 6, end), phaseStart: start, phaseEnd: end };
}

function getJourneyPageBounds() {
  if (!journeyPhotos.length) return { start: 0, end: 0, next: 0, previous: 0 };
  const phase = journeyPhotos[journeyIndex].phase;
  let phaseStart = journeyIndex;
  while (phaseStart > 0 && journeyPhotos[phaseStart - 1].phase === phase) phaseStart--;
  let phaseEnd = journeyIndex + 1;
  while (phaseEnd < journeyPhotos.length && journeyPhotos[phaseEnd].phase === phase) phaseEnd++;
  const start = phaseStart + Math.floor((journeyIndex - phaseStart) / 6) * 6;
  const end = Math.min(start + 6, phaseEnd);
  const next = end >= journeyPhotos.length ? 0 : end;
  let previous;
  if (start > phaseStart) {
    previous = start - 6;
  } else if (phaseStart > 0) {
    const previousPhase = journeyPhotos[phaseStart - 1].phase;
    let previousStart = phaseStart - 1;
    while (previousStart > 0 && journeyPhotos[previousStart - 1].phase === previousPhase) previousStart--;
    previous = previousStart + Math.floor((phaseStart - 1 - previousStart) / 6) * 6;
  } else {
    const last = journeyPhotos.length - 1;
    const lastPhase = journeyPhotos[last].phase;
    let lastStart = last;
    while (lastStart > 0 && journeyPhotos[lastStart - 1].phase === lastPhase) lastStart--;
    previous = lastStart + Math.floor((last - lastStart) / 6) * 6;
  }
  return { start, end, next, previous };
}

function renderJourneyCurrent() {
  if (!journeyMode || !journeyPhotos.length) return;

  const { start, end } = getJourneyPageBounds();
  const photo = journeyPhotos[start];
  journeyPhase = photo.phase;
  currentImages = journeyPhotos.slice(start, end).map(p => p.src);
  photoPageIndex = 0;
  totalPhotoPages = 1;

  const media = $("media");
  media.replaceChildren();
  const gallery = document.createElement("div");
  gallery.id = "gallery";
  gallery.className = "count-" + currentImages.length;

  currentImages.forEach((src, i) => {
    const card = document.createElement("div");
    card.className = "photo-card";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "수하의 " + photo.phase + " 시절 추억 " + (start + i + 1);
    img.loading = "eager";
    img.onerror = () => {
      img.style.display = "none";
      card.textContent = "사진을 불러올 수 없습니다";
    };
    card.appendChild(img);
    card.onclick = () => openLightbox(i);
    gallery.appendChild(card);
  });
  media.appendChild(gallery);

  $("title").textContent = photo.title || "수하의 추억";
  const firstDate = journeyPhotos[start].date;
  const lastDate = journeyPhotos[end - 1].date;
  $("meta").textContent =
    (firstDate === lastDate ? firstDate : firstDate + " ~ " + lastDate) +
    " · " + (photo.phase === "어린이집" ? "어린이집 시절" : "유치원 시절");
  $("body").textContent = photo.phase === "어린이집"
    ? "🧸 어린이집 시절의 소중한 순간"
    : "🎒 유치원 시절의 소중한 순간";
  $("listTitle").textContent = photo.phase === "어린이집"
    ? "🧸 어린이집 시절" : "🎒 유치원 시절";
  renderList();
  $("status").textContent =
    photo.phase + " 추억 · " + (start + 1) + " ~ " + end +
    " / " + journeyPhotos.length + "장 · 6초마다 전환";
}

// 성장 추억 다음 사진 묶음
function nextJourneyPhoto() {
  if (!journeyMode || !journeyPhotos.length) return;
  journeyIndex = getJourneyPageBounds().next;
  renderJourneyCurrent();
  schedulePlayback();
}

// 현재 사진 페이지 표시
function renderGalleryPage() {

  const media = $("media");

  media.replaceChildren();

  if (!currentImages.length) {

    const empty = document.createElement("div");

    empty.className = "no-photo";
    empty.textContent = "사진 없음";

    media.appendChild(empty);

    return;
  }

  totalPhotoPages = Math.ceil(currentImages.length / 6);

  const start = photoPageIndex * 6;

  const end = Math.min(start + 6, currentImages.length);

  const pageImages = currentImages.slice(start, end);

  const gallery = document.createElement("div");

  gallery.id = "gallery";
  gallery.className = "count-" + pageImages.length;

  pageImages.forEach((src, i) => {

    const imageIndex = start + i;

    const card = document.createElement("div");

    card.className = "photo-card";

    const img = document.createElement("img");

    img.src = src;
    img.alt = "수하의 성장기록 사진 " + (imageIndex + 1);
    img.loading = "eager";

    img.onerror = () => {
      img.style.display = "none";

      const errorText = document.createElement("span");

      errorText.textContent = "사진을 불러올 수 없습니다";
      errorText.style.fontSize = "12px";

      card.appendChild(errorText);
    };

    card.appendChild(img);

    card.onclick = () => {
      openLightbox(imageIndex);
    };

    gallery.appendChild(card);

  });

  media.appendChild(gallery);

  // 여러 페이지일 때 좌우 페이지 이동 버튼
  if (totalPhotoPages > 1) {

    const prevBtn = document.createElement("button");

    prevBtn.className = "gallery-nav gallery-prev";
    prevBtn.textContent = "‹";

    prevBtn.onclick = event => {
      event.stopPropagation();
      changePhotoPage(-1);
    };

    const nextBtn = document.createElement("button");

    nextBtn.className = "gallery-nav gallery-next";
    nextBtn.textContent = "›";

    nextBtn.onclick = event => {
      event.stopPropagation();
      changePhotoPage(1);
    };

    media.appendChild(prevBtn);
    media.appendChild(nextBtn);

  }

  const count = document.createElement("div");

  count.id = "photoCount";

  count.textContent =
    "페이지 " +
    (photoPageIndex + 1) +
    " / " +
    totalPhotoPages +
    " · 사진 " +
    (start + 1) +
    "–" +
    end +
    " / " +
    currentImages.length;

  media.appendChild(count);

}

// 사진 페이지 변경
function changePhotoPage(direction) {

  if (totalPhotoPages <= 1) return;

  photoPageIndex += direction;

  if (photoPageIndex < 0) {
    photoPageIndex = totalPhotoPages - 1;
  }

  if (photoPageIndex >= totalPhotoPages) {
    photoPageIndex = 0;
  }

  renderGalleryPage();

  schedulePlayback();

}

// 확대 모달 열기
function openLightbox(imageIndex) {

  if (!currentImages.length) return;

  clearTimers();

  lightboxOpen = true;

  lightboxIndex = imageIndex;

  updateLightbox();

  $("lightbox").classList.add("open");

}

// 확대 사진 표시
function updateLightbox() {

  if (!currentImages.length) return;

  const image = $("lightboxImage");

  image.src = currentImages[lightboxIndex];

  $("lightboxCount").textContent =
    (lightboxIndex + 1) + " / " + currentImages.length;

  const showNavigation = currentImages.length > 1;

  $("lightboxPrev").style.display =
    showNavigation ? "block" : "none";

  $("lightboxNext").style.display =
    showNavigation ? "block" : "none";

}

// 확대 모달 사진 이동
function moveLightbox(direction) {

  if (!currentImages.length) return;

  lightboxIndex =
    (lightboxIndex + direction + currentImages.length) %
    currentImages.length;

  updateLightbox();

}

// 확대 모달 닫기
function closeLightbox(resume = true) {

  if (!lightboxOpen) return;

  lightboxOpen = false;

  $("lightbox").classList.remove("open");

  $("lightboxImage").src = "";

  if (resume) {
    schedulePlayback();
  }

}

// 자동 재생 예약
function schedulePlayback() {

  clearTimers();

  if (paused || lightboxOpen) return;

  if (journeyMode) {
    if (!journeyPhotos.length) return;
    journeyTimer = setTimeout(nextJourneyPhoto, 6000);
    return;
  }

  if (!isAutoCategory() || !items.length) return;

  // 사진이 7장 이상이면 페이지 단위로 7초마다 이동
  if (currentImages.length > 6) {

    pageTimer = setTimeout(() => {

      if (photoPageIndex < totalPhotoPages - 1) {

        photoPageIndex++;

        renderGalleryPage();

        schedulePlayback();

      } else {

        next();

      }

    }, 7000);

  } else {

    // 사진이 6장 이하이거나 사진이 없으면 45초 표시
    recordTimer = setTimeout(() => {

      next();

    }, 45000);

  }

}

// 현재 기록 표시
async function render() {

  clearTimers();

  if (journeyMode) {
    renderJourneyCurrent();
    schedulePlayback();
    return;
  }

  if (!items.length) {

    detailRequest++;

    currentImages = [];
    photoPageIndex = 0;
    totalPhotoPages = 0;

    $("media").replaceChildren();

    const empty = document.createElement("div");

    empty.className = "no-photo";

    empty.textContent =
      cat === "오늘의 추억"
        ? "오늘은 과거의 추억이 없어요 ❤️"
        : "표시할 기록이 없습니다";

    $("media").appendChild(empty);

    $("title").textContent = "기록 없음";
    $("meta").textContent = "";
    $("body").textContent = "";
    $("list").textContent = "기록이 없습니다";

    return;
  }

  const p = items[idx];

  const requestId = ++detailRequest;

  currentImages = [];
  photoPageIndex = 0;
  totalPhotoPages = 0;

  $("title").textContent = p.title || "제목 없음";

  $("meta").textContent =
    [p.date, p.category].filter(Boolean).join(" · ");

  $("media").replaceChildren();

  const loading = document.createElement("div");

  loading.className = "no-photo";
  loading.textContent = "사진 불러오는 중...";

  $("media").appendChild(loading);

  $("body").textContent = "내용 불러오는 중...";

  renderList();

  try {

    const detail = await loadDetail(p.id);

    if (requestId !== detailRequest) return;

    $("body").textContent = detail.text || "";

    currentImages = detail.images || [];

    photoPageIndex = 0;

    totalPhotoPages = Math.ceil(currentImages.length / 6);

    renderGalleryPage();

    schedulePlayback();

  } catch (error) {

    if (requestId !== detailRequest) return;

    $("media").replaceChildren();

    const errorBox = document.createElement("div");

    errorBox.className = "no-photo";
    errorBox.textContent = "내용을 불러오지 못했습니다";

    $("media").appendChild(errorBox);

    $("body").textContent = error.message;

    schedulePlayback();

  }

}

// 카테고리 선택
function select(c) {

  clearTimers();

  closeLightbox(false);

  cat = c;
  journeyMode = false;
  journeyLoadToken++;

  if (c === "성장 추억 여행") {
    startJourney();
    document.querySelectorAll("#tabs button").forEach(button => {
      button.classList.toggle("active", button.dataset.cat === c);
    });
    return;
  }

  if (c === "전체") {

    items = all;

  } else if (c === "추억 랜덤") {

    items = getMemoryItems();

  } else if (c === "오늘의 추억") {

    items = getTodayItems();

  } else if (c === "알림장") {

    items = all.filter(x =>
      x.category === "알림장" &&
      ["2022", "2023", "2024"].includes(
        String(x.date || "").substring(0, 4)
      )
    );

  } else {

    items = all.filter(x =>
      x.category === c
    );

  }

  if (
    isAutoCategory() &&
    items.length
  ) {

    idx = Math.floor(Math.random() * items.length);

    paused = false;

    $("pause").textContent = "일시정지";

  } else {

    idx = 0;

    paused = true;

    $("pause").textContent = "재생";

  }

  document.querySelectorAll("#tabs button").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.cat === c
    );

  });

  render();

  if (c === "추억 랜덤") {

    $("status").textContent =
      "추억 랜덤 재생 중 · " + items.length + "개";

  } else if (c === "오늘의 추억") {

    $("status").textContent =
      items.length
        ? "오늘의 추억 · " + items.length + "개"
        : "오늘은 과거의 추억이 없어요 ❤️";

  } else if (
    c === "앨범" ||
    c === "알림장"
  ) {

    $("status").textContent =
      c + " 랜덤 재생 중 · " + items.length + "개";

  } else {

    $("status").textContent =
      c + " 카테고리 · " + items.length + "개";

  }

}

// 다음 기록
function next() {

  if (journeyMode) {
    clearTimers();
    nextJourneyPhoto();
    return;
  }

  if (!items.length) return;

  clearTimers();

  if (items.length === 1) {

    idx = 0;

  } else {

    let nextIndex;

    do {

      nextIndex = Math.floor(Math.random() * items.length);

    } while (nextIndex === idx);

    idx = nextIndex;

  }

  render();

}

// 이전 기록
function previous() {

  if (journeyMode) {
    if (!journeyPhotos.length) return;
    clearTimers();
    const bounds = getJourneyPageBounds(journeyIndex);
    journeyIndex = bounds.start > bounds.phaseStart
      ? Math.max(bounds.phaseStart, bounds.start - 6)
      : bounds.phaseStart > 0
        ? getJourneyPageBounds(bounds.phaseStart - 1).start
        : getJourneyPageBounds(journeyPhotos.length - 1).start;
    renderJourneyCurrent();
    schedulePlayback();
    return;
  }

  if (!items.length) return;

  clearTimers();

  idx = (idx - 1 + items.length) % items.length;

  render();

}

// 재생 / 일시정지
function togglePause() {

  if (journeyMode ? !journeyPhotos.length : !items.length) return;

  paused = !paused;

  $("pause").textContent =
    paused ? "재생" : "일시정지";

  if (paused) {

    clearTimers();

  } else {

    schedulePlayback();

  }

}

// 사진 스와이프
let touchStartX = 0;

$("media").addEventListener("touchstart", event => {

  touchStartX = event.changedTouches[0].screenX;

}, { passive: true });

$("media").addEventListener("touchend", event => {

  if (currentImages.length <= 6) return;

  const touchEndX = event.changedTouches[0].screenX;

  const diff = touchEndX - touchStartX;

  if (Math.abs(diff) < 60) return;

  if (diff < 0) {

    changePhotoPage(1);

  } else {

    changePhotoPage(-1);

  }

}, { passive: true });

// 확대 모달 터치 스와이프
let lightboxTouchStartX = 0;

$("lightbox").addEventListener("touchstart", event => {

  if (!lightboxOpen) return;

  lightboxTouchStartX = event.changedTouches[0].screenX;

}, { passive: true });

$("lightbox").addEventListener("touchend", event => {

  if (!lightboxOpen || currentImages.length <= 1) return;

  const diff =
    event.changedTouches[0].screenX - lightboxTouchStartX;

  if (Math.abs(diff) < 60) return;

  moveLightbox(diff < 0 ? 1 : -1);

}, { passive: true });

// 데이터 불러오기
async function load() {

  try {

    $("status").textContent = "전체 기록 조회 중...";

    all = await loadAllPages();

    $("status").textContent =
      "전체 " + all.length + "개 기록 조회 완료";

    select("추억 랜덤");

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

    $("media").textContent =
      "데이터를 불러오지 못했습니다";

  }

}

// 이벤트
document.querySelectorAll("#tabs button").forEach(button => {

  button.onclick = () => select(button.dataset.cat);

});

$("prev").onclick = previous;
$("next").onclick = next;
$("pause").onclick = togglePause;

$("lightboxClose").onclick = () => closeLightbox();

$("lightboxPrev").onclick = event => {
  event.stopPropagation();
  moveLightbox(-1);
};

$("lightboxNext").onclick = event => {
  event.stopPropagation();
  moveLightbox(1);
};

// 확대 영역 바깥 클릭 시 닫기
$("lightbox").addEventListener("click", event => {

  if (event.target === $("lightbox")) {
    closeLightbox();
  }

});

// 키보드 조작
document.addEventListener("keydown", event => {

  if (!lightboxOpen) return;

  if (event.key === "Escape") {

    closeLightbox();

  } else if (event.key === "ArrowLeft") {

    moveLightbox(-1);

  } else if (event.key === "ArrowRight") {

    moveLightbox(1);

  }

});

// 시계
function updateClock() {

  $("clock").textContent =
    new Date().toLocaleString("ko-KR");

}

updateClock();

setInterval(updateClock, 1000);

load();

</script>
