<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사랑하는 수하의 성장기록</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #f5f1e8;
  color: #493f34;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* 상단 */
header {
  height: 65px;
  padding: 12px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 25px;
  color: #514638;
  letter-spacing: -0.5px;
}

#clock {
  color: #8c806e;
  font-size: 14px;
}

/* 탭 */
#tabs {
  display: flex;
  gap: 9px;
  padding: 5px 25px 15px;
  flex-wrap: wrap;
}

#tabs button,
.controls button {
  border: 1px solid #e1d9ca;
  border-radius: 10px;
  padding: 10px 18px;
  background: #e9e3d7;
  color: #665b4b;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

#tabs button:hover,
.controls button:hover {
  background: #dce5d7;
}

#tabs button.active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#tabs button[data-cat="추억 랜덤"] {
  background: #d6c18d;
  border-color: #d6c18d;
  color: #594b2f;
}

#tabs button[data-cat="추억 랜덤"].active {
  background: #a88c4c;
  border-color: #a88c4c;
  color: white;
}

#tabs button[data-cat="오늘의 추억"] {
  background: #e8d8d9;
  border-color: #e8d8d9;
  color: #785b62;
}

#tabs button[data-cat="오늘의 추억"].active {
  background: #bd929e;
  border-color: #bd929e;
  color: white;
}

/* 메인 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 18px;
  padding: 0 25px 18px;
  height: calc(100% - 125px);
  min-height: 0;
}

/* 좌우 패널 */
.viewer,
.sidebar {
  background: #fffdf8;
  border: 1px solid #e9e1d4;
  border-radius: 17px;
  padding: 18px;
  min-height: 0;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(100, 83, 55, .06);
}

.viewer {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 사진 영역 */
#media {
  position: relative;
  flex: 0 0 43%;
  min-height: 180px;
  max-height: 430px;
  background: #eee8dc;
  border: 1px solid #e7dfd1;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #998d7b;
}

#media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* 사진 넘기기 */
.photo-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 45px;
  height: 65px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 10px;
  background: rgba(70, 75, 60, .58);
  color: white;
  font-size: 30px;
  cursor: pointer;
  z-index: 5;
}

.photo-prev {
  left: 10px;
}

.photo-next {
  right: 10px;
}

.photo-nav:active {
  background: rgba(93, 119, 83, .9);
}

#photoCount {
  position: absolute;
  bottom: 10px;
  right: 12px;
  background: rgba(65, 60, 48, .75);
  color: white;
  padding: 6px 11px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 6;
}

/* 제목과 날짜 */
#title {
  font-size: 21px;
  line-height: 1.4;
  margin: 3px 0 0;
  color: #514638;
  flex-shrink: 0;
}

#meta {
  font-size: 13px;
  color: #9a8d7b;
  flex-shrink: 0;
}

/* 본문 */
#body {
  flex: 1;
  min-height: 100px;
  margin: 0;
  padding: 7px 5px 7px 0;
  white-space: pre-wrap;
  line-height: 1.75;
  font-size: 15px;
  overflow-y: auto;
  overflow-wrap: anywhere;
  color: #51483e;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

/* 하단 버튼 */
.controls {
  display: flex;
  gap: 9px;
  flex-shrink: 0;
}

.controls button {
  min-width: 65px;
  padding: 11px 17px;
  background: #e8e4d9;
}

.controls button:active {
  background: #82977a;
  color: white;
}

#status {
  color: #9a8d7b;
  font-size: 12px;
  flex-shrink: 0;
}

/* 오른쪽 목록 */
.sidebar {
  display: flex;
  flex-direction: column;
  background: #faf8f1;
}

.sidebar h2 {
  margin: 2px 0 14px;
  font-size: 18px;
  color: #5b5042;
  flex-shrink: 0;
}

#list {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid #e8e1d5;
  border-radius: 10px;
  background: #fffdf9;
  color: #574d41;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.5;
  transition: background .2s;
}

.item:hover {
  background: #f0f2e9;
}

.item.selected {
  border-color: #91a586;
  background: #e8eee2;
  color: #43563c;
}

.item small {
  display: block;
  margin-top: 5px;
  color: #9b8f7e;
}

/* 태블릿 세로 화면 */
@media (max-width: 800px) {

  body {
    overflow: auto;
  }

  header {
    height: auto;
    padding: 15px;
  }

  h1 {
    font-size: 20px;
  }

  #tabs {
    padding: 10px 15px;
    gap: 6px;
  }

  #tabs button {
    padding: 9px 11px;
  }

  .layout {
    display: flex;
    flex-direction: column;
    height: auto;
    padding: 0 15px 15px;
  }

  .viewer {
    min-height: 700px;
  }

  #media {
    flex-basis: auto;
    height: 360px;
    flex-shrink: 0;
  }

  #body {
    min-height: 180px;
  }

  .sidebar {
    height: 450px;
  }
}
</style>
</head>

<body>

<header>
  <h1>사랑하는 수하의 성장기록</h1>
  <div id="clock"></div>
</header>

<nav id="tabs">
  <button data-cat="전체">전체</button>
  <button data-cat="추억 랜덤">⭐ 추억 랜덤</button>
  <button data-cat="오늘의 추억">📅 오늘의 추억</button>
  <button data-cat="알림장">알림장</button>
  <button data-cat="앨범">앨범</button>
  <button data-cat="공지">공지</button>
</nav>

<div class="layout">

  <section class="viewer">

    <div id="media">기록을 불러오는 중...</div>

    <h2 id="title">불러오는 중</h2>

    <div id="meta"></div>

    <div id="body"></div>

    <div class="controls">
      <button id="prev">이전</button>
      <button id="pause">일시정지</button>
      <button id="next">다음</button>
    </div>

    <div id="status">데이터 불러오는 중...</div>

  </section>

  <aside class="sidebar">

    <h2 id="listTitle">추억 랜덤</h2>

    <div id="list"></div>

  </aside>

</div>

<script>
const $ = id => document.getElementById(id);

let all = [];
let items = [];
let idx = 0;

let cat = "추억 랜덤";
let paused = false;

let detailRequest = 0;
let timer = null;
let photoTimer = null;

let currentImages = [];
let currentImageIndex = 0;

// 전체 기록 조회
async function loadAllPages() {

  const records = [];
  let cursor = null;

  do {

    let url = "/api/data";

    if (cursor) {
      url += "?cursor=" + encodeURIComponent(cursor);
    }

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "기록 조회 실패");
    }

    records.push(...(data.items || []));

    cursor = data.has_more
      ? data.next_cursor
      : null;

    $("status").textContent =
      "기록 불러오는 중... " + records.length + "개";

  } while (cursor);

  return records;
}

// 상세 기록 조회
async function loadDetail(pageId) {

  const response = await fetch(
    "/api/detail?id=" + encodeURIComponent(pageId)
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "상세 기록 조회 실패");
  }

  return data;
}

// 날짜 월일 추출
function getMonthDay(dateValue) {

  if (!dateValue) return "";

  const match = String(dateValue).match(
    /^\d{4}-(\d{2})-(\d{2})/
  );

  return match ? match[1] + "-" + match[2] : "";

}

// 추억 랜덤 대상
function getMemoryItems() {

  const albums = all.filter(x =>
    x.category === "앨범"
  );

  const oldNotices = all.filter(x =>
    x.category === "알림장" &&
    ["2022", "2023", "2024"].includes(
      String(x.date || "").substring(0, 4)
    )
  );

  return [...albums, ...oldNotices];

}

// 오늘의 추억
function getTodayItems() {

  const today = new Date();

  const monthDay =
    String(today.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(today.getDate()).padStart(2, "0");

  return all.filter(x =>
    getMonthDay(x.date) === monthDay
  );

}

// 목록 표시
function renderList() {

  const list = $("list");

  list.replaceChildren();

  items.forEach((x, i) => {

    const button = document.createElement("button");

    button.className =
      "item" + (i === idx ? " selected" : "");

    button.appendChild(
      document.createTextNode(x.title || "제목 없음")
    );

    const small = document.createElement("small");

    small.textContent =
      [x.date, x.category].filter(Boolean).join(" · ");

    button.appendChild(small);

    button.onclick = () => {

      idx = i;
      paused = true;

      $("pause").textContent = "재생";

      render();

    };

    list.appendChild(button);

  });

  $("listTitle").textContent =
    cat === "추억 랜덤"
      ? "⭐ 추억 랜덤 기록"
      : cat === "오늘의 추억"
        ? "📅 오늘의 추억"
        : cat === "전체"
          ? "전체 기록"
          : cat + " 기록";

}

// 사진 표시
function showPhoto(index) {

  if (!currentImages.length) return;

  currentImageIndex =
    (index + currentImages.length) % currentImages.length;

  const media = $("media");

  media.replaceChildren();

  const img = document.createElement("img");

  img.src = currentImages[currentImageIndex];
  img.alt = "수하의 성장기록 사진";

  img.onerror = () => {
    media.textContent = "사진을 불러올 수 없습니다";
  };

  media.appendChild(img);

  if (currentImages.length > 1) {

    const prevBtn = document.createElement("button");

    prevBtn.className = "photo-nav photo-prev";
    prevBtn.textContent = "‹";

    prevBtn.onclick = event => {
      event.stopPropagation();
      showPhoto(currentImageIndex - 1);
    };

    const nextBtn = document.createElement("button");

    nextBtn.className = "photo-nav photo-next";
    nextBtn.textContent = "›";

    nextBtn.onclick = event => {
      event.stopPropagation();
      showPhoto(currentImageIndex + 1);
    };

    media.appendChild(prevBtn);
    media.appendChild(nextBtn);

    const count = document.createElement("div");

    count.id = "photoCount";

    count.textContent =
      (currentImageIndex + 1) + " / " + currentImages.length;

    media.appendChild(count);

  }

}

// 사진 타이머 정리
function clearPhotoTimer() {

  if (photoTimer) {
    clearInterval(photoTimer);
    photoTimer = null;
  }

}

// 현재 기록 표시
async function render() {

  clearPhotoTimer();

  if (!items.length) {

    detailRequest++;

    $("media").textContent =
      cat === "오늘의 추억"
        ? "오늘은 과거의 추억이 없어요 ❤️"
        : "표시할 기록이 없습니다";

    $("title").textContent = "기록 없음";
    $("meta").textContent = "";
    $("body").textContent = "";
    $("list").textContent = "기록이 없습니다";

    return;
  }

  const p = items[idx];

  const requestId = ++detailRequest;

  currentImages = [];
  currentImageIndex = 0;

  $("title").textContent = p.title || "제목 없음";

  $("meta").textContent =
    [p.date, p.category].filter(Boolean).join(" · ");

  $("media").textContent = "사진 불러오는 중...";
  $("body").textContent = "내용 불러오는 중...";

  renderList();

  try {

    const detail = await loadDetail(p.id);

    if (requestId !== detailRequest) return;

    $("body").textContent = detail.text || "";

    currentImages = detail.images || [];

    if (currentImages.length) {

      showPhoto(0);

      if (
        currentImages.length > 1 &&
        !paused &&
        (
          cat === "앨범" ||
          cat === "알림장" ||
          cat === "추억 랜덤" ||
          cat === "오늘의 추억"
        )
      ) {

        photoTimer = setInterval(() => {

          if (requestId !== detailRequest) {
            clearPhotoTimer();
            return;
          }

          if (currentImageIndex < currentImages.length - 1) {

            showPhoto(currentImageIndex + 1);

          } else {

            clearPhotoTimer();
            next();

          }

        }, 7000);

      }

    } else {

      $("media").textContent = "사진 없음";

    }

  } catch (error) {

    if (requestId !== detailRequest) return;

    $("media").textContent = "내용을 불러오지 못했습니다";
    $("body").textContent = error.message;

  }

}

// 카테고리 선택
function select(c) {

  clearPhotoTimer();

  cat = c;

  if (c === "전체") {

    items = all;

  } else if (c === "추억 랜덤") {

    items = getMemoryItems();

  } else if (c === "오늘의 추억") {

    items = getTodayItems();

  } else if (c === "알림장") {

    items = all.filter(x =>
      x.category === "알림장" &&
      ["2022", "2023", "2024"].includes(
        String(x.date || "").substring(0, 4)
      )
    );

  } else {

    items = all.filter(x =>
      x.category === c
    );

  }

  if (
    (
      c === "앨범" ||
      c === "알림장" ||
      c === "추억 랜덤" ||
      c === "오늘의 추억"
    ) &&
    items.length
  ) {

    idx = Math.floor(Math.random() * items.length);

    paused = false;

    $("pause").textContent = "일시정지";

  } else {

    idx = 0;

    paused = true;

    $("pause").textContent = "재생";

  }

  document.querySelectorAll("#tabs button").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.cat === c
    );

  });

  render();

  if (c === "추억 랜덤") {

    $("status").textContent =
      "추억 랜덤 재생 중 · " + items.length + "개";

  } else if (c === "오늘의 추억") {

    $("status").textContent =
      items.length
        ? "오늘의 추억 · " + items.length + "개"
        : "오늘은 과거의 추억이 없어요 ❤️";

  } else if (
    c === "앨범" ||
    c === "알림장"
  ) {

    $("status").textContent =
      c + " 랜덤 재생 중 · " + items.length + "개";

  } else {

    $("status").textContent =
      c + " 카테고리 · " + items.length + "개";

  }

}

// 다음 기록
function next() {

  if (!items.length) return;

  clearPhotoTimer();

  if (items.length === 1) {

    idx = 0;

  } else {

    let nextIndex;

    do {

      nextIndex = Math.floor(Math.random() * items.length);

    } while (nextIndex === idx);

    idx = nextIndex;

  }

  render();

}

// 이전 기록
function previous() {

  if (!items.length) return;

  clearPhotoTimer();

  idx = (idx - 1 + items.length) % items.length;

  render();

}

// 재생 / 일시정지
function togglePause() {

  if (!items.length) return;

  paused = !paused;

  $("pause").textContent =
    paused ? "재생" : "일시정지";

  render();

}

// 자동 재생
function startTimer() {

  if (timer) clearInterval(timer);

  timer = setInterval(() => {

    if (
      (
        cat === "앨범" ||
        cat === "알림장" ||
        cat === "추억 랜덤" ||
        cat === "오늘의 추억"
      ) &&
      !paused &&
      currentImages.length <= 1 &&
      items.length > 0
    ) {

      next();

    }

  }, 45000);

}

// 사진 스와이프
let touchStartX = 0;

$("media").addEventListener("touchstart", event => {

  touchStartX = event.changedTouches[0].screenX;

}, { passive: true });

$("media").addEventListener("touchend", event => {

  if (currentImages.length < 2) return;

  const touchEndX = event.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;

  if (Math.abs(diff) < 50) return;

  if (diff < 0) {

    showPhoto(currentImageIndex + 1);

  } else {

    showPhoto(currentImageIndex - 1);

  }

}, { passive: true });

// 데이터 불러오기
async function load() {

  try {

    $("status").textContent = "전체 기록 조회 중...";

    all = await loadAllPages();

    $("status").textContent =
      "전체 " + all.length + "개 기록 조회 완료";

    select("추억 랜덤");

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

    $("media").textContent =
      "데이터를 불러오지 못했습니다";

  }

}

// 이벤트
document.querySelectorAll("#tabs button").forEach(button => {

  button.onclick = () => select(button.dataset.cat);

});

$("prev").onclick = previous;
$("next").onclick = next;
$("pause").onclick = togglePause;

// 시계
function updateClock() {

  $("clock").textContent =
    new Date().toLocaleString("ko-KR");

}

updateClock();

setInterval(updateClock, 1000);

startTimer();

load();

</script>

</body>
</html>
