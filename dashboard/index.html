
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 아이 성장 기록</title>
<style>
body{margin:0;background:#10151d;color:#fff;font-family:sans-serif}
.app{padding:24px;max-width:1200px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:32px}
nav{display:flex;gap:8px;margin:20px 0}
button{padding:12px 20px;border:0;border-radius:20px;cursor:pointer}
.active{background:#dce8f5}
main{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
section,aside{background:#1a2330;border-radius:18px;padding:20px}
#media{height:45vh;display:grid;place-items:center;background:#0b1017}
#media img{width:100%;height:100%;object-fit:contain}
#body{white-space:pre-wrap;line-height:1.7}
.item{display:block;width:100%;margin:6px 0;text-align:left}
@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><h1>우리 아이 성장 기록</h1><div id="clock"></div></header>
<nav id="tabs">
<button class="active" data-cat="전체">전체</button>
<button data-cat="알림장">알림장</button>
<button data-cat="앨범">앨범</button>
<button data-cat="공지">공지</button>
</nav>
<main>
<section>
<div id="media">노션 연결 대기 중</div>
<p id="meta"></p>
<h2 id="title">우리 아이의 소중한 순간</h2>
<div id="body"></div>
</section>
<aside>
<h3>최근 기록</h3>
<div id="list">불러오는 중...</div>
</aside>
</main>
<p id="status">연결 대기 중</p>
<button id="prev">이전</button>
<button id="next">다음</button>
<button id="pause">일시정지</button>
</div>
<script>
let all=[],items=[],idx=0,cat="전체",paused=false;
const $=id=>document.getElementById(id);
function render(){
 if(!items.length){$("media").textContent="표시할 기록이 없습니다";$("title").textContent="기록 없음";return}
 let p=items[idx];
 $("title").textContent=p.title||"제목 없음";
 $("meta").textContent=[p.date,p.category].filter(Boolean).join(" · ");
 $("body").textContent=p.text||"";
 $("media").innerHTML=p.images?.length?`<img src="${p.images[0]}">`:"사진 없음";
 $("list").innerHTML="";
 items.slice(0,50).forEach((x,i)=>{
 let b=document.createElement("button");b.className="item";
 b.textContent=x.title||"제목 없음";b.onclick=()=>{idx=i;render()};
 $("list").appendChild(b);
 });
}
function select(c){
 cat=c;items=c==="전체"?all:all.filter(x=>x.category===c);idx=0;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.cat===c));
 render();
}
async function load(){
 try{
 let r=await fetch("/api/data");let j=await r.json();
 if(!r.ok)throw Error(j.error||"API 오류");
 all=j.items||[];select(cat);
 $("status").textContent="노션 연결됨 · "+all.length+"개 기록";
 }catch(e){$("status").textContent="연결 오류: "+e.message}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>select(b.dataset.cat));
$("prev").onclick=()=>{if(items.length){idx=(idx-1+items.length)%items.length;render()}};
$("next").onclick=()=>{if(items.length){idx=(idx+1)%items.length;render()}};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"재생":"일시정지"};
setInterval(()=>{if(!paused&&items.length){idx=Math.floor(Math.random()*items.length);render()}},45000);
setInterval(()=>{$("clock").textContent=new Date().toLocaleString("ko-KR")},1000);
load();setInterval(load,600000);
</script>
</body>
</html>
