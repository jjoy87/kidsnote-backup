<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사랑하는 수하의 성장기록</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #f5f1e8;
  color: #493f34;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* 상단 */
header {
  height: 54px;
  padding: 8px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 21px;
  color: #514638;
  letter-spacing: -0.5px;
}

#clock {
  color: #8c806e;
  font-size: 14px;
  white-space: nowrap;
}

.header-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  min-width: 0;
}

.auto-interval-control {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #8c806e;
  font-size: 12px;
  white-space: nowrap;
}

#autoInterval {
  border: 1px solid #ded5c5;
  border-radius: 8px;
  background: #fffdf8;
  color: #665b4b;
  padding: 5px 7px;
  font-size: 12px;
  min-height: 30px;
}

/* 탭 */
#tabs {
  display: flex;
  gap: 9px;
  padding: 3px 25px 8px;
  flex-wrap: wrap;
}

#tabs button,
.controls button {
  border: 1px solid #e1d9ca;
  border-radius: 10px;
  padding: 7px 15px;
  background: #e9e3d7;
  color: #665b4b;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

#countdown {
  display: inline-flex;
  align-items: center;
  margin-left: 2px;
  color: #78866f;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

#tabs button:hover,
.controls button:hover {
  background: #dce5d7;
}

#tabs button.active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#tabs button[data-cat="추억 랜덤"] {
  background: #d6c18d;
  border-color: #d6c18d;
  color: #594b2f;
}

#tabs button[data-cat="추억 랜덤"].active {
  background: #a88c4c;
  border-color: #a88c4c;
  color: white;
}

#tabs button[data-cat="성장 추억 여행"] {
  background: #dce6d8;
  border-color: #dce6d8;
  color: #52664c;
}

#tabs button[data-cat="성장 추억 여행"].active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#tabs button[data-cat="오늘의 추억"] {
  background: #e8d8d9;
  border-color: #e8d8d9;
  color: #785b62;
}

#tabs button[data-cat="오늘의 추억"].active {
  background: #bd929e;
  border-color: #bd929e;
  color: white;
}

/* 메인 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 3.5fr) minmax(220px, 1fr);
  gap: 16px;
  padding: 0 25px 18px;
  height: calc(100% - 101px);
  min-height: 0;
}

/* 좌우 패널 */
.viewer,
.sidebar {
  background: #fffdf8;
  border: 1px solid #e9e1d4;
  border-radius: 17px;
  padding: 16px;
  min-height: 0;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(100, 83, 55, .06);
}

.viewer {
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

/* 제목·날짜·조작 버튼은 상단에 고정 */
.viewer-top {
  flex: 0 0 auto;
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 5px;
  background: #fffdf8;
}

/* 사진과 본문만 하나의 스크롤 영역으로 묶음 */
.record-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

.viewer.text-only #media {
  display: none;
}

.viewer.text-only #body {
  min-height: 120px;
  margin-top: 8px;
  padding: 22px 24px;
  background: #faf8f2;
  border: 1px solid #e9e1d4;
  border-radius: 13px;
  font-size: 17px;
  line-height: 1.9;
}

/* 사진 갤러리: 본문과 함께 왼쪽 패널에서 스크롤 */
#media {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  aspect-ratio: 16 / 10;
  min-height: 220px;
  max-height: 560px;
  background: #eee8dc;
  border: 1px solid #e7dfd1;
  border-radius: 13px;
  overflow: hidden;
  color: #998d7b;
}

/* 갤러리 그리드 */
#gallery {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 9px;
  padding: 10px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

/* 사진 개수별 레이아웃 */
#gallery.count-1 {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

#gallery.count-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: 1fr;
}

#gallery.count-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: 1fr;
}

#gallery.count-4 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

#gallery.count-5,
#gallery.count-6 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

/* 사진 카드 */
.photo-card {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #e5ddcf;
  border-radius: 10px;
  background: #faf8f2;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-in;
  transition: transform .2s, box-shadow .2s;
}

.photo-card:hover {
  transform: scale(1.012);
  box-shadow: 0 3px 12px rgba(70, 60, 40, .12);
}

.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.photo-card::after {
  content: "확대";
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 4px 8px;
  border-radius: 7px;
  background: rgba(65, 60, 48, .65);
  color: white;
  font-size: 11px;
  opacity: 0;
  transition: opacity .2s;
}

.photo-card:hover::after {
  opacity: 1;
}

/* 페이지 이동 버튼 */
.gallery-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 58px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 10px;
  background: rgba(70, 75, 60, .65);
  color: white;
  font-size: 29px;
  cursor: pointer;
  z-index: 5;
}

.gallery-prev {
  left: 10px;
}

.gallery-next {
  right: 10px;
}

.gallery-nav:hover {
  background: rgba(93, 119, 83, .9);
}

/* 사진 페이지 표시 */
#photoCount {
  position: absolute;
  bottom: 12px;
  right: 13px;
  background: rgba(65, 60, 48, .78);
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 6;
  pointer-events: none;
}

/* 사진 없음 */
.no-photo {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #998d7b;
}

/* 제목과 날짜 */
#title {
  font-size: 18px;
  line-height: 1.25;
  margin: 3px 0 0;
  color: #514638;
  flex-shrink: 0;
}

#meta {
  display: none;
  font-size: 13px;
  color: #9a8d7b;
  flex-shrink: 0;
}

/* 본문 */
#body {
  display: block;
  min-height: 60px;
  margin: 0;
  padding: 14px 5px 22px 0;
  white-space: pre-wrap;
  line-height: 1.75;
  font-size: 15px;
  overflow: visible;
  overflow-wrap: anywhere;
  color: #51483e;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

/* 조작 버튼은 제목·날짜와 함께 상단에 유지 */
.controls {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: nowrap;
  flex-shrink: 0;
  padding: 0;
}

.controls button {
  min-width: 36px;
  width: 38px;
  padding: 6px 4px;
  font-size: 18px;
  line-height: 1;
  background: #e8e4d9;
}

.controls button:active {
  background: #82977a;
  color: white;
}

#favoriteToggle {
  color: #68736b;
  background: #e8e4d9;
}
#favoriteToggle.is-favorite {
  color: #e53935;
  background: #ffe4e2;
  text-shadow: 0 0 1px rgba(229, 57, 53, 0.25);
}
body.dark-mode #favoriteToggle {
  color: #c5c9c4;
  background: #3d423e;
}
body.dark-mode #favoriteToggle.is-favorite {
  color: #ff625e;
  background: #572f31;
  text-shadow: 0 0 2px rgba(255, 98, 94, 0.35);
}

#status {
  display: inline-flex; /* 재생 장수 표시는 카운트다운 옆에 유지 */
  align-items: center;
  color: #9a8d7b;
  font-size: 12px;
  flex-shrink: 0;
  margin-left: 2px;
}

/* 오른쪽 목록 */
.sidebar {
  display: flex;
  flex-direction: column;
  background: #faf8f1;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

.sidebar h2 {
  margin: 2px 0 14px;
  font-size: 18px;
  color: #5b5042;
  flex-shrink: 0;
}

#noticeGroups {
  display: none;
  gap: 8px;
  margin: -3px 0 12px;
  flex-shrink: 0;
}

#noticeGroups.visible {
  display: flex;
}

#noticeGroups button {
  flex: 1;
  min-width: 0;
  padding: 9px 6px;
  border: 1px solid #e1d9ca;
  border-radius: 9px;
  background: #eee8dc;
  color: #665b4b;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

#noticeGroups button.active {
  background: #82977a;
  border-color: #82977a;
  color: white;
}

#list {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #b8c5ae transparent;
}

.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px;
  margin-bottom: 8px;
  border: 1px solid #e8e1d5;
  border-radius: 10px;
  background: #fffdf9;
  color: #574d41;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.5;
  transition: background .2s;
  overflow-wrap: anywhere;
}

.item:hover {
  background: #f0f2e9;
}

.item.selected {
  border-color: #91a586;
  background: #e8eee2;
  color: #43563c;
}

.item small {
  display: block;
  margin-top: 5px;
  color: #9b8f7e;
}

/* 확대 모달 */
#lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(25, 25, 22, .94);
  padding: 55px 70px;
}

#lightbox.open {
  display: flex;
}

#lightboxImage {
  max-width: 94%;
  max-height: 88%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 5px;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: pinch-zoom;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 24px;
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 30px;
  cursor: pointer;
  z-index: 3;
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 68px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 36px;
  cursor: pointer;
  z-index: 3;
}

.lightbox-prev {
  left: 18px;
}

.lightbox-next {
  right: 18px;
}

.lightbox-close:hover,
.lightbox-nav:hover {
  background: rgba(255,255,255,.3);
}

#lightboxCount {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 15px;
  border-radius: 20px;
  background: rgba(255,255,255,.16);
  color: white;
  font-size: 14px;
}

/* 작은 화면에서도 좌측 기록과 우측 목록을 독립 스크롤 */
@media (max-width: 800px) {

  html, body {
    height: 100%;
    min-height: 0;
  }

  body {
    overflow: hidden;
  }

  header {
    height: auto;
    min-height: 44px;
    padding: 6px 14px;
  }

  h1 {
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #clock {
    font-size: 10px;
  }

  .header-tools {
    gap: 5px;
  }

  .auto-interval-control {
    gap: 3px;
    font-size: 10px;
  }

  #themeToggle {
    min-height: 28px;
    padding: 4px 7px;
    font-size: 11px;
  }

  #autoInterval {
    padding: 4px 3px;
    font-size: 11px;
    min-height: 28px;
    max-width: 68px;
  }

  #tabs {
    padding: 4px 12px 6px;
    gap: 5px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
  }

  #tabs button {
    flex: 0 0 auto;
    padding: 6px 9px;
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(112px, 0.42fr);
    gap: 8px;
    height: calc(100dvh - 88px);
    min-height: 0;
    padding: 0 8px 8px;
  }

  .viewer,
  .sidebar {
    min-width: 0;
    min-height: 0;
    height: 100%;
    padding: 10px;
  }

  .viewer-top {
    gap: 3px;
    padding-bottom: 4px;
  }

  .record-scroll {
    min-height: 0;
  }

  #media {
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    max-height: none;
    aspect-ratio: 4 / 3;
  }

  #body {
    min-height: 0;
    padding: 10px 2px 18px;
    font-size: 14px;
  }

  .controls {
    gap: 5px;
    flex-wrap: nowrap;
    align-items: center;
  }

  .controls button {
    min-width: 34px;
    width: 36px;
    padding: 6px 3px;
    font-size: 17px;
    line-height: 1;
    flex: 0 0 36px;
  }

  .sidebar h2 {
    font-size: 15px;
    margin-bottom: 8px;
  }

  #noticeGroups {
    flex-direction: column;
    gap: 5px;
    margin-bottom: 8px;
  }

  #noticeGroups button {
    font-size: 11px;
    padding: 7px 3px;
  }

  .item {
    padding: 7px;
    font-size: 11px;
    line-height: 1.4;
  }

  .item small {
    font-size: 10px;
  }

  #lightbox {
    padding: 55px 45px;
  }

  #lightboxImage {
    max-width: 100%;
    max-height: 85%;
  }

  .lightbox-prev {
    left: 5px;
  }

  .lightbox-next {
    right: 5px;
  }
}

/* 다크 모드: 기존 파스텔 포인트는 유지하고 밝은 패널·카드만 어둡게 */
#themeToggle {
  border: 1px solid #ded5c5;
  border-radius: 8px;
  background: #e9e3d7;
  color: #665b4b;
  padding: 5px 9px;
  min-height: 30px;
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
}

body.dark-mode {
  background: #252525;
  color: #e7e1d7;
}
body.dark-mode h1,
body.dark-mode #title,
body.dark-mode .sidebar h2,
body.dark-mode #body,
body.dark-mode .item {
  color: #e7e1d7;
}
body.dark-mode #clock,
body.dark-mode .auto-interval-control,
body.dark-mode #meta,
body.dark-mode #status,
body.dark-mode .item small {
  color: #b8afa2;
}
body.dark-mode .viewer,
body.dark-mode .sidebar,
body.dark-mode .viewer-top {
  background: #303030;
  border-color: #48443e;
}
body.dark-mode .record-scroll,
body.dark-mode #list {
  scrollbar-color: #777064 transparent;
}
body.dark-mode #body,
body.dark-mode .viewer.text-only #body,
body.dark-mode .photo-card {
  background: #383838;
  border-color: #514c44;
}
body.dark-mode .item {
  background: #393939;
  border-color: #514c44;
}
body.dark-mode .item:hover,
body.dark-mode .item.selected {
  background: #465143;
  border-color: #82977a;
  color: #f0f3eb;
}
body.dark-mode #autoInterval,
body.dark-mode #themeToggle {
  background: #414141;
  border-color: #625d54;
  color: #eee8de;
}
body.dark-mode .controls button {
  background: #48463f;
  border-color: #625d54;
  color: #eee8de;
}
body.dark-mode #noticeGroups button:not(.active) {
  background: #45423b;
  border-color: #625d54;
  color: #eee8de;
}
body.dark-mode #media {
  background: #292929;
  border-color: #514c44;
}
body.dark-mode .no-photo {
  color: #b8afa2;
}

/* 감상 모드: 기존 갤러리와 본문 DOM을 그대로 사용 */
#cinemaEnter { white-space: nowrap; width:30px; min-width:30px; height:28px; padding:4px 0; font-size:16px; line-height:1; flex:0 0 30px; display:inline-flex; align-items:center; justify-content:center; }
.controls { display:flex; align-items:center; flex-wrap:wrap; gap:5px; min-width:0; }
.controls #countdown, .controls #status { flex:0 1 auto; }
#cinemaExit { display:none; position:absolute; right:12px; top:12px; z-index:30; border:1px solid rgba(255,255,255,.55); border-radius:10px; padding:9px 13px; background:rgba(35,42,35,.78); color:white; font-size:13px; cursor:pointer; }
#cinemaInfo { display:none; }
body.cinema-mode header, body.cinema-mode #tabs, body.cinema-mode .viewer-top, body.cinema-mode .sidebar { display:none !important; }
body.cinema-mode .layout { position:fixed; inset:0; z-index:100; display:block; height:100%; padding:0; background:#f5f1e8; }
body.cinema-mode .viewer { position:relative; width:100%; height:100%; border:0; border-radius:0; padding:14px; box-shadow:none; }
body.cinema-mode .record-scroll { display:flex; gap:14px; overflow:hidden; height:100%; }
body.cinema-mode #media { flex: 0 0 65%; height:100%; min-height:0; max-height:none; aspect-ratio:auto; }
body.cinema-mode #cinemaRight { display:flex; flex:1 1 0; min-width:0; flex-direction:column; border-radius:13px; background:#faf8f2; border:1px solid #e9e1d4; overflow:hidden; }
body.cinema-mode #cinemaInfo { display:block; flex:0 0 auto; padding:17px 18px 12px; border-bottom:1px solid #e9e1d4; }
body.cinema-mode #cinemaTitle { font-size:18px; font-weight:700; line-height:1.4; padding-right:72px; overflow-wrap:anywhere; }
body.cinema-mode #cinemaMeta { font-size:12px; margin-top:6px; opacity:.75; }
body.cinema-mode #body { display:block !important; flex:1 1 auto; min-height:0; overflow-y:auto; margin:0; padding:18px; border:0; background:transparent; white-space:pre-wrap; overflow-wrap:anywhere; }
body.cinema-mode #cinemaJourneyContent { overflow-y:auto; padding:0 18px 18px; }
body.cinema-mode #cinemaJourneyContent .cinema-entry { padding:12px 0; border-bottom:1px solid #ded8cb; }
body.cinema-mode #cinemaJourneyContent .cinema-entry strong { display:block; font-size:14px; margin-bottom:5px; }
body.cinema-mode #cinemaJourneyContent .cinema-entry small { display:block; opacity:.7; margin-bottom:7px; }
body.cinema-mode #cinemaExit { display:block; }
body.cinema-mode .viewer.text-only #media { display:flex !important; }
body.cinema-mode #gallery { height:100%; }
body.dark-mode.cinema-mode .layout { background:#181c19; }

<script>
const $ = id => document.getElementById(id);

let all = [];
let items = [];
let idx = 0;

// 즐겨찾기는 브라우저별 localStorage에 기록 ID 단위로 저장한다.
const FAVORITES_STORAGE_KEY = "kidsnoteDashboardFavorites";
let favoriteIds = new Set();
try {
  const savedFavorites = JSON.parse(localStorage.getItem(FAVORITES_STORAGE_KEY) || "[]");
  if (Array.isArray(savedFavorites)) favoriteIds = new Set(savedFavorites.map(String));
} catch (e) {}

function isFavorite(recordId) {
  return !!recordId && favoriteIds.has(String(recordId));
}

function saveFavorites() {
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify([...favoriteIds]));
  } catch (e) {}
}

function getCurrentRecordId() {
  if (journeyMode && journeyPhotos.length) {
    const start = Math.floor(journeyIndex / 6) * 6;
    return journeyPhotos[start]?.recordId || "";
  }
  return items[idx]?.id || "";
}

function updateFavoriteButton() {
  const button = $("favoriteToggle");
  if (!button) return;
  const recordId = getCurrentRecordId();
  const active = isFavorite(recordId);
  button.textContent = active ? "★" : "☆";
  button.classList.toggle("is-favorite", active);
  button.disabled = !recordId;
  button.setAttribute("aria-label", active ? "즐겨찾기 해제" : "즐겨찾기 추가");
  button.title = active ? "즐겨찾기 해제" : "즐겨찾기 추가";
}

function toggleFavorite() {
  const recordId = getCurrentRecordId();
  if (!recordId) return;
  const key = String(recordId);
  if (favoriteIds.has(key)) favoriteIds.delete(key);
  else favoriteIds.add(key);
  saveFavorites();
  updateFavoriteButton();
  if (cat === "즐겨찾기") {
    items = all.filter(record => favoriteIds.has(String(record.id)));
    if (!items.length) idx = 0;
    else idx = Math.min(idx, items.length - 1);
    renderList();
    render();
  }
}


let cat = "추억 랜덤";
let paused = false;
let noticeGroup = "어린이집";

let detailRequest = 0;

let recordTimer = null;
let pageTimer = null;
let countdownInterval = null;
let countdownRemaining = 0;

let currentImages = [];

let photoPageIndex = 0;
let totalPhotoPages = 0;

let lightboxOpen = false;
let lightboxIndex = 0;

// 성장 추억 여행 상태
let journeyMode = false;
let journeyPhotos = [];
let journeyPools = { "어린이집": [], "유치원": [] };
let journeyPreviousBatchKeys = { "어린이집": new Set(), "유치원": new Set() };
let journeyIndex = 0;
let journeyTimer = null;
let journeyLoadToken = 0;
let journeyPhase = "어린이집";

// 자동 재생 대상 카테고리
function isAutoCategory() {
  return [
    "전체",
    "앨범",
    "알림장",
    "공지",
    "추억 랜덤",
    "성장 추억 여행",
    "오늘의 추억",
    "즐겨찾기"
  ].includes(cat);
}

// 모든 카테고리와 사진 페이지에 공통 적용하는 자동 넘김 시간(초)
let autoAdvanceSeconds = 45;
try {
  const savedInterval = Number(localStorage.getItem("kidsnoteAutoAdvanceSeconds"));
  if ([10, 15, 20, 30, 45, 60, 90, 120].includes(savedInterval)) {
    autoAdvanceSeconds = savedInterval;
  }
} catch (e) {}

// 자동 넘김 카운트다운 표시
function startCountdown(seconds) {
  if (countdownInterval) clearInterval(countdownInterval);
  countdownRemaining = seconds;
  const label = $("countdown");
  const update = () => {
    if (label) label.textContent = countdownRemaining + "초 뒤 자동 넘김";
  };
  update();
  countdownInterval = setInterval(() => {
    countdownRemaining = Math.max(0, countdownRemaining - 1);
    update();
    if (countdownRemaining === 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }, 1000);
}

// 타이머 정리
function clearTimers() {

  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
  countdownRemaining = 0;
  const countdownLabel = $("countdown");
  if (countdownLabel) countdownLabel.textContent = paused ? "일시정지" : "자동 넘김 대기";

  if (recordTimer) {
    clearTimeout(recordTimer);
    recordTimer = null;
  }

  if (pageTimer) {
    clearTimeout(pageTimer);
    pageTimer = null;
  }

  if (journeyTimer) {
    clearTimeout(journeyTimer);
    journeyTimer = null;
  }

}

// 전체 기록 조회
async function loadAllPages() {

  const records = [];
  let cursor = null;

  do {

    let url = "/api/data";

    if (cursor) {
      url += "?cursor=" + encodeURIComponent(cursor);
    }

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "기록 조회 실패");
    }

    records.push(...(data.items || []));

    cursor = data.has_more
      ? data.next_cursor
      : null;

    $("status").textContent =
      "기록 불러오는 중... " + records.length + "개";

  } while (cursor);

  return records;
}

// 상세 기록 조회
async function loadDetail(pageId) {

  const response = await fetch(
    "/api/detail?id=" + encodeURIComponent(pageId)
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "상세 기록 조회 실패");
  }

  return data;
}

// 날짜 월일 추출
function getMonthDay(dateValue) {

  if (!dateValue) return "";

  const match = String(dateValue).match(
    /^\d{4}-(\d{2})-(\d{2})/
  );

  return match ? match[1] + "-" + match[2] : "";

}

// 추억 랜덤 대상
function getMemoryItems() {

  const albums = all.filter(x =>
    x.category === "앨범"
  );

  const oldNotices = all.filter(x =>
    x.category === "알림장" &&
    ["2022", "2023", "2024"].includes(
      String(x.date || "").substring(0, 4)
    )
  );

  return [...albums, ...oldNotices];

}

// 오늘의 추억
function getTodayItems() {

  const today = new Date();

  const monthDay =
    String(today.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(today.getDate()).padStart(2, "0");

  // 오늘의 추억에는 Kidsnote의 실제 생활 기록만 포함한다.
  // 어린이집(2024-02-29까지): 알림장 + 앨범
  // 유치원(2024-03-01부터): 앨범만
  // 공지, 영양분석, 통계 대시보드 등은 제외한다.
  return all.filter(x => {
    const date = String(x.date || "").substring(0, 10);
    if (getMonthDay(date) !== monthDay) return false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;

    if (date <= "2024-02-29") {
      return ["알림장", "앨범"].includes(x.category);
    }

    return date >= "2024-03-01" && x.category === "앨범";
  });

}

// 카테고리별 어린이집 / 유치원 시기 분류
function getPeriodItems(category, group) {
  return all.filter(x => {
    if (x.category !== category) return false;
    const date = String(x.date || "").substring(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;

    return group === "어린이집"
      ? date <= "2024-02-29"
      : date >= "2024-03-01";
  });
}

function getNoticeItems(group) {
  return getPeriodItems("알림장", group);
}

// 목록 표시
function renderList() {

  const list = $("list");

  list.replaceChildren();

  const noticeGroups = $("noticeGroups");
  const periodCategories = ["알림장", "앨범", "공지"];
  noticeGroups.classList.toggle("visible", periodCategories.includes(cat));

  if (periodCategories.includes(cat)) {
    noticeGroups.querySelectorAll("button").forEach(button => {
      const group = button.dataset.noticeGroup;
      button.classList.toggle("active", group === noticeGroup);
      button.onclick = () => {
        if (group === noticeGroup) return;
        noticeGroup = group;
        items = getPeriodItems(cat, noticeGroup);
        idx = items.length ? Math.floor(Math.random() * items.length) : 0;
        paused = false;
        $("pause").textContent = "⏸";
        $("pause").setAttribute("aria-label", "일시정지");
        $("pause").title = "일시정지";
        render();
        $("status").textContent =
          noticeGroup + " " + cat + " · " + items.length + "개";
      };
    });
  }

  if (journeyMode) {
    $("listTitle").textContent = "🌱 성장 추억 여행 · " + journeyPhase;

    journeyPhotos.forEach((photo, i) => {
      const button = document.createElement("button");
      button.className = "item" + (i === journeyIndex ? " selected" : "");
      button.appendChild(document.createTextNode(photo.title || "수하의 추억"));

      const small = document.createElement("small");
      small.textContent = [photo.date, photo.phase].filter(Boolean).join(" · ");
      button.appendChild(small);

      button.onclick = () => {
        journeyIndex = i;
        clearTimers();
        closeLightbox(false);
        renderJourneyCurrent();
        schedulePlayback();
      };

      list.appendChild(button);
    });
    return;
  }

  items.forEach((x, i) => {

    const button = document.createElement("button");

    button.className =
      "item" + (i === idx ? " selected" : "");

    button.appendChild(
      document.createTextNode(x.title || "제목 없음")
    );

    const small = document.createElement("small");

    small.textContent =
      [x.date, x.category].filter(Boolean).join(" · ");

    button.appendChild(small);

   button.onclick = () => {

  idx = i;

  clearTimers();

  closeLightbox(false);

  render();

};

    list.appendChild(button);

  });

  $("listTitle").textContent =
    cat === "추억 랜덤"
      ? "⭐ 추억 랜덤 기록"
      : cat === "오늘의 추억"
        ? "📅 오늘의 추억"
        : cat === "즐겨찾기"
          ? "⭐ 즐겨찾기 기록"
          : cat === "전체"
            ? "전체 기록"
            : cat + " 기록";

}


// 성장 추억 여행: 어린이집(알림장 + 앨범) → 유치원(앨범)
function getJourneyRecords(phase) {
  return all.filter(x => {
    const date = String(x.date || "").substring(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;

    if (phase === "어린이집") {
      return ["알림장", "앨범"].includes(x.category) &&
        date >= "2022-01-01" && date <= "2024-02-29";
    }

    return x.category === "앨범" &&
      date >= "2024-03-01" && date <= new Date().toISOString().substring(0, 10);
  });
}

// 해당 시기의 전체 사진을 한 번 수집한다. 이후 재생은 30장씩 새로 추첨한다.
async function loadJourneyPhotos(phase, token) {
  const records = getJourneyRecords(phase);
  const found = [];
  let cursor = 0;

  async function worker() {
    while (cursor < records.length) {
      const record = records[cursor++];
      try {
        const detail = await loadDetail(record.id);
        if (token !== journeyLoadToken) return;

        (detail.images || []).forEach((src, imageIndex) => {
          found.push({
            src,
            date: record.date || "",
            title: record.title || "수하의 추억",
            phase,
            recordId: record.id,
            imageIndex
          });
        });
      } catch (error) {
        console.warn("성장 추억 사진 조회 실패:", record.title, error);
      }
    }
  }

  // 동시에 4개씩 상세 기록을 조회한다.
  await Promise.all(Array.from({ length: 4 }, () => worker()));
  if (token !== journeyLoadToken) return [];
  return found;
}

// Fisher-Yates 방식으로 공정하게 섞는다.
function shufflePhotos(photos) {
  const result = [...photos];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

// 해당 시기의 사진 중 최대 30장을 새 무작위 묶음으로 만든다.
// 바로 직전 묶음과의 중복을 가능한 한 피한다.
function makeJourneyBatch(phase) {
  const pool = journeyPools[phase] || [];
  const previousKeys = journeyPreviousBatchKeys[phase] || new Set();
  const shuffled = shufflePhotos(pool);
  const fresh = shuffled.filter(photo =>
    !previousKeys.has(photo.recordId + ":" + photo.imageIndex)
  );
  const selected = fresh.slice(0, 30);
  if (selected.length < Math.min(30, pool.length)) {
    const selectedKeys = new Set(selected.map(photo => photo.recordId + ":" + photo.imageIndex));
    const fill = shuffled.filter(photo =>
      !selectedKeys.has(photo.recordId + ":" + photo.imageIndex)
    );
    selected.push(...fill.slice(0, 30 - selected.length));
  }
  journeyPreviousBatchKeys[phase] = new Set(
    selected.map(photo => photo.recordId + ":" + photo.imageIndex)
  );
  return shufflePhotos(selected);
}

function beginJourneyBatch(phase) {
  journeyPhase = phase;
  journeyPhotos = makeJourneyBatch(phase);
  journeyIndex = 0;
  renderJourneyCurrent();
}

async function startJourney() {
  const token = ++journeyLoadToken;
  journeyMode = true;
  paused = false;
  journeyPhotos = [];
  journeyPools = { "어린이집": [], "유치원": [] };
  journeyPreviousBatchKeys = { "어린이집": new Set(), "유치원": new Set() };
  journeyIndex = 0;
  journeyPhase = "어린이집";
  items = [];
  idx = 0;
  clearTimers();

  $("pause").textContent = "⏸";
        $("pause").setAttribute("aria-label", "일시정지");
        $("pause").title = "일시정지";
  $("title").textContent = "수하의 성장 추억을 준비하고 있어요";
  $("meta").textContent = "어린이집 30장 → 유치원 30장 반복";
  $("body").textContent = "어린이집과 유치원의 사진을 모으는 중입니다. 사진 수에 따라 시간이 걸릴 수 있어요.";
  $("media").innerHTML = '<div class="no-photo">추억 사진을 모으는 중...</div>';
  $("listTitle").textContent = "🌱 성장 추억 여행";
  $("list").textContent = "사진을 준비하고 있습니다...";
  $("status").textContent = "어린이집 시절 사진 조회 중...";

  const [childcare, kindergarten] = await Promise.all([
    loadJourneyPhotos("어린이집", token),
    loadJourneyPhotos("유치원", token)
  ]);
  if (token !== journeyLoadToken) return;

  journeyPools["어린이집"] = childcare;
  journeyPools["유치원"] = kindergarten;

  if (!childcare.length && !kindergarten.length) {
    $("title").textContent = "추억 사진이 없습니다";
    $("meta").textContent = "";
    $("body").textContent = "해당 기간의 알림장·앨범 사진을 찾지 못했습니다.";
    $("media").innerHTML = '<div class="no-photo">표시할 사진이 없습니다</div>';
    $("list").textContent = "사진이 없습니다";
    $("status").textContent = "성장 추억 여행 사진 없음";
    return;
  }

  // 첫 묶음은 어린이집, 다음 묶음은 유치원으로 번갈아 재생한다.
  const firstPhase = childcare.length ? "어린이집" : "유치원";
  beginJourneyBatch(firstPhase);
  $("status").textContent =
    "어린이집 사진 " + childcare.length + "장 보유 · 유치원 사진 " +
    kindergarten.length + "장 보유 · 회차별 최대 30장씩 번갈아 재생";
  schedulePlayback();
}

// 현재 30장 묶음 안에서 6장씩 보여준다.
function getJourneyPageBounds() {
  if (!journeyPhotos.length) return { start: 0, end: 0, next: -1, previous: 0 };
  const start = Math.floor(journeyIndex / 6) * 6;
  const end = Math.min(start + 6, journeyPhotos.length);
  return {
    start,
    end,
    next: end < journeyPhotos.length ? end : -1,
    previous: Math.max(0, start - 6)
  };
}

function renderJourneyCurrent() {
  if (!journeyMode || !journeyPhotos.length) return;

  const recordScroll = document.querySelector(".record-scroll");
  if (recordScroll) recordScroll.scrollTop = 0;

  const { start, end } = getJourneyPageBounds();
  const photo = journeyPhotos[start];
  journeyPhase = photo.phase;
  currentImages = journeyPhotos.slice(start, end).map(p => p.src);
  photoPageIndex = 0;
  totalPhotoPages = 1;

  const media = $("media");
  media.replaceChildren();
  const gallery = document.createElement("div");
  gallery.id = "gallery";
  gallery.className = "count-" + currentImages.length;

  currentImages.forEach((src, i) => {
    const card = document.createElement("div");
    card.className = "photo-card";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "수하의 " + photo.phase + " 시절 추억 " + (start + i + 1);
    img.loading = "eager";
    img.onerror = () => {
      img.style.display = "none";
      card.textContent = "사진을 불러올 수 없습니다";
    };
    card.appendChild(img);
    card.onclick = () => openLightbox(i);
    gallery.appendChild(card);
  });
  media.appendChild(gallery);

  $("title").textContent = photo.title || "수하의 추억";
  const firstDate = journeyPhotos[start].date;
  const lastDate = journeyPhotos[end - 1].date;
  $("meta").textContent =
    (firstDate === lastDate ? firstDate : firstDate + " ~ " + lastDate) +
    " · " + (photo.phase === "어린이집" ? "어린이집 시절" : "유치원 시절");
  $("body").textContent = photo.phase === "어린이집"
    ? "🧸 어린이집 시절의 소중한 순간"
    : "🎒 유치원 시절의 소중한 순간";
  $("listTitle").textContent = photo.phase === "어린이집"
    ? "🧸 어린이집 시절" : "🎒 유치원 시절";
  renderList();
  updateFavoriteButton();
  $("status").textContent =
    photo.phase + " 랜덤 " + (start + 1) + " ~ " + end +
    " / 이번 회차 " + journeyPhotos.length + "장";
}

// 현재 30장 묶음을 모두 재생하면 반대 시기의 새 30장 묶음으로 넘어간다.
function nextJourneyPhoto() {
  if (!journeyMode || !journeyPhotos.length) return;
  const bounds = getJourneyPageBounds();
  if (bounds.next >= 0) {
    journeyIndex = bounds.next;
    renderJourneyCurrent();
  } else {
    const nextPhase = journeyPhase === "어린이집" ? "유치원" : "어린이집";
    const available = journeyPools[nextPhase] || [];
    if (available.length) {
      beginJourneyBatch(nextPhase);
    } else {
      // 반대 시기에 사진이 없으면 현재 시기의 새 묶음으로 계속 재생한다.
      beginJourneyBatch(journeyPhase);
    }
  }
  schedulePlayback();
}

// 현재 사진 페이지 표시
function renderGalleryPage() {

  const media = $("media");

  media.replaceChildren();

  if (!currentImages.length) {
    return;
  }

  totalPhotoPages = Math.ceil(currentImages.length / 6);

  const start = photoPageIndex * 6;

  const end = Math.min(start + 6, currentImages.length);

  const pageImages = currentImages.slice(start, end);

  const gallery = document.createElement("div");

  gallery.id = "gallery";
  gallery.className = "count-" + pageImages.length;

  pageImages.forEach((src, i) => {

    const imageIndex = start + i;

    const card = document.createElement("div");

    card.className = "photo-card";

    const img = document.createElement("img");

    img.src = src;
    img.alt = "수하의 성장기록 사진 " + (imageIndex + 1);
    img.loading = "eager";

    img.onerror = () => {
      img.style.display = "none";

      const errorText = document.createElement("span");

      errorText.textContent = "사진을 불러올 수 없습니다";
      errorText.style.fontSize = "12px";

      card.appendChild(errorText);
    };

    card.appendChild(img);

    card.onclick = () => {
      openLightbox(imageIndex);
    };

    gallery.appendChild(card);

  });

  media.appendChild(gallery);

  // 여러 페이지일 때 좌우 페이지 이동 버튼
  if (totalPhotoPages > 1) {

    const prevBtn = document.createElement("button");

    prevBtn.className = "gallery-nav gallery-prev";
    prevBtn.textContent = "‹";

    prevBtn.onclick = event => {
      event.stopPropagation();
      changePhotoPage(-1);
    };

    const nextBtn = document.createElement("button");

    nextBtn.className = "gallery-nav gallery-next";
    nextBtn.textContent = "›";

    nextBtn.onclick = event => {
      event.stopPropagation();
      changePhotoPage(1);
    };

    media.appendChild(prevBtn);
    media.appendChild(nextBtn);

  }

  const count = document.createElement("div");

  count.id = "photoCount";

  count.textContent =
    "페이지 " +
    (photoPageIndex + 1) +
    " / " +
    totalPhotoPages +
    " · 사진 " +
    (start + 1) +
    "–" +
    end +
    " / " +
    currentImages.length;

  media.appendChild(count);

}

// 사진 페이지 변경
function changePhotoPage(direction) {

  if (totalPhotoPages <= 1) return;

  photoPageIndex += direction;

  if (photoPageIndex < 0) {
    photoPageIndex = totalPhotoPages - 1;
  }

  if (photoPageIndex >= totalPhotoPages) {
    photoPageIndex = 0;
  }

  renderGalleryPage();

  schedulePlayback();

}

// 확대 모달 열기
function openLightbox(imageIndex) {

  if (!currentImages.length) return;

  clearTimers();

  lightboxOpen = true;

  lightboxIndex = imageIndex;

  updateLightbox();

  $("lightbox").classList.add("open");

}

// 확대 사진 표시
function updateLightbox() {

  if (!currentImages.length) return;

  const image = $("lightboxImage");

  image.src = currentImages[lightboxIndex];

  $("lightboxCount").textContent =
    (lightboxIndex + 1) + " / " + currentImages.length;

  const showNavigation = currentImages.length > 1;

  $("lightboxPrev").style.display =
    showNavigation ? "block" : "none";

  $("lightboxNext").style.display =
    showNavigation ? "block" : "none";

}

// 확대 모달 사진 이동
function moveLightbox(direction) {

  if (!currentImages.length) return;

  lightboxIndex =
    (lightboxIndex + direction + currentImages.length) %
    currentImages.length;

  updateLightbox();

}

// 확대 모달 닫기
function closeLightbox(resume = true) {

  if (!lightboxOpen) return;

  lightboxOpen = false;

  $("lightbox").classList.remove("open");

  $("lightboxImage").src = "";

  if (resume) {
    schedulePlayback();
  }

}

// 자동 재생 예약
function schedulePlayback() {

  clearTimers();

  if (paused || lightboxOpen) return;

  if (journeyMode) {
    if (!journeyPhotos.length) return;
    startCountdown(autoAdvanceSeconds);
    journeyTimer = setTimeout(nextJourneyPhoto, autoAdvanceSeconds * 1000);
    return;
  }

  if (!isAutoCategory() || !items.length) return;

  // 사진 페이지도 기록도 동일한 사용자 설정 시간으로 자동 전환
  if (currentImages.length > 6) {

    startCountdown(autoAdvanceSeconds);
    pageTimer = setTimeout(() => {

      if (photoPageIndex < totalPhotoPages - 1) {

        photoPageIndex++;

        renderGalleryPage();

        schedulePlayback();

      } else {

        next();

      }

    }, autoAdvanceSeconds * 1000);

  } else {

    const displayTime = autoAdvanceSeconds * 1000;
    startCountdown(autoAdvanceSeconds);

    recordTimer = setTimeout(() => {
      next();
    }, displayTime);

  }

}

// 현재 기록 표시
async function render() {

  clearTimers();

  // 자동/수동으로 일반 기록이 바뀔 때마다 본문 스크롤을 맨 위로 초기화
  const recordScroll = document.querySelector(".record-scroll");
  if (recordScroll) recordScroll.scrollTop = 0;

  if (journeyMode) {
    renderJourneyCurrent();
    schedulePlayback();
    return;
  }

  if (!items.length) {

    // 기록이 0개인 카테고리로 이동해도 사이드바 제목과 시기 탭을
    // 현재 카테고리 기준으로 즉시 갱신한다.
    renderList();

    detailRequest++;

    currentImages = [];
    photoPageIndex = 0;
    totalPhotoPages = 0;

    $("media").closest(".viewer").classList.remove("text-only");
    $("media").replaceChildren();

    const empty = document.createElement("div");

    empty.className = "no-photo";

    empty.textContent =
      cat === "오늘의 추억"
        ? "오늘은 과거의 추억이 없어요 ❤️"
        : cat === "즐겨찾기"
          ? "즐겨찾기에 등록한 기록이 없습니다 ⭐"
          : "표시할 기록이 없습니다";

    $("media").appendChild(empty);

    $("title").textContent = "기록 없음";
    $("meta").textContent = "";
    $("body").textContent = "";
    $("list").textContent = "기록이 없습니다";
    updateFavoriteButton();

    return;
  }

  const p = items[idx];
  updateFavoriteButton();

  const requestId = ++detailRequest;

  $("media").closest(".viewer").classList.remove("text-only");

  currentImages = [];
  photoPageIndex = 0;
  totalPhotoPages = 0;

  $("title").textContent = p.title || "제목 없음";

  $("meta").textContent =
    [p.date, p.category].filter(Boolean).join(" · ");

  $("media").replaceChildren();

  const loading = document.createElement("div");

  loading.className = "no-photo";
  loading.textContent = "사진 불러오는 중...";

  $("media").appendChild(loading);

  $("body").textContent = "내용 불러오는 중...";

  renderList();

  try {

    const detail = await loadDetail(p.id);

    if (requestId !== detailRequest) return;

    $("body").textContent = detail.text || "";

    currentImages = detail.images || [];

    photoPageIndex = 0;

    totalPhotoPages = Math.ceil(currentImages.length / 6);

    const viewer = $("media").closest(".viewer");
    viewer.classList.toggle("text-only", currentImages.length === 0);

    renderGalleryPage();

    schedulePlayback();

  } catch (error) {

    if (requestId !== detailRequest) return;

    $("media").replaceChildren();

    const errorBox = document.createElement("div");

    errorBox.className = "no-photo";
    errorBox.textContent = "내용을 불러오지 못했습니다";

    $("media").appendChild(errorBox);

    $("body").textContent = error.message;

    schedulePlayback();

  }

}

// 카테고리 선택
function select(c) {

  clearTimers();

  closeLightbox(false);

  cat = c;
  journeyMode = false;
  journeyLoadToken++;

  if (c === "성장 추억 여행") {
    startJourney();
    document.querySelectorAll("#tabs button").forEach(button => {
      button.classList.toggle("active", button.dataset.cat === c);
    });
    return;
  }

  if (c === "전체") {

    items = all;

  } else if (c === "추억 랜덤") {

    items = getMemoryItems();

  } else if (c === "오늘의 추억") {

    items = getTodayItems();

  } else if (c === "즐겨찾기") {

    items = all.filter(x => favoriteIds.has(String(x.id)));

  } else if (["알림장", "앨범", "공지"].includes(c)) {

    // 알림장 / 앨범 / 공지 모두 어린이집·유치원 시기로 분리
    noticeGroup = "어린이집";
    items = getPeriodItems(c, noticeGroup);

  } else {

    items = all.filter(x =>
      x.category === c
    );

  }

  if (
    isAutoCategory() &&
    items.length
  ) {

    idx = Math.floor(Math.random() * items.length);

    paused = false;

    $("pause").textContent = "⏸";
        $("pause").setAttribute("aria-label", "일시정지");
        $("pause").title = "일시정지";

  } else {

    idx = 0;

    paused = true;

    $("pause").textContent = "▶";
    $("pause").setAttribute("aria-label", "재생");
    $("pause").title = "재생";

  }

  document.querySelectorAll("#tabs button").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.cat === c
    );

  });

  render();

  if (c === "추억 랜덤") {

    $("status").textContent =
      "추억 랜덤 재생 중 · " + items.length + "개";

  } else if (c === "오늘의 추억") {

    $("status").textContent =
      items.length
        ? "오늘의 추억 · " + items.length + "개"
        : "오늘은 과거의 추억이 없어요 ❤️";

  } else if (c === "즐겨찾기") {

    $("status").textContent = "즐겨찾기 · " + items.length + "개";

  } else if (["알림장", "앨범", "공지"].includes(c)) {

    $("status").textContent =
      noticeGroup + " " + c + " · " + items.length + "개";

  } else {

    $("status").textContent =
      c + " 카테고리 · " + items.length + "개";

  }

}

// 다음 기록
function next() {

  if (journeyMode) {
    clearTimers();
    nextJourneyPhoto();
    return;
  }

  if (!items.length) return;

  clearTimers();

  if (items.length === 1) {

    idx = 0;

  } else {

    let nextIndex;

    do {

      nextIndex = Math.floor(Math.random() * items.length);

    } while (nextIndex === idx);

    idx = nextIndex;

  }

  render();

}

// 이전 기록
function previous() {

  if (journeyMode) {
    if (!journeyPhotos.length) return;
    clearTimers();
    const bounds = getJourneyPageBounds();
    if (bounds.start > 0) {
      journeyIndex = bounds.previous;
      renderJourneyCurrent();
    } else {
      const previousPhase = journeyPhase === "어린이집" ? "유치원" : "어린이집";
      if ((journeyPools[previousPhase] || []).length) beginJourneyBatch(previousPhase);
      else beginJourneyBatch(journeyPhase);
      const lastStart = Math.floor((journeyPhotos.length - 1) / 6) * 6;
      journeyIndex = lastStart;
      renderJourneyCurrent();
    }
    schedulePlayback();
    return;
  }

  if (!items.length) return;

  clearTimers();

  idx = (idx - 1 + items.length) % items.length;

  render();

}

// 수동 이전/다음은 날짜순(오래된 기록 → 최신 기록)으로 이동
// 자동 재생용 next()/previous()의 랜덤 동작은 그대로 유지
function manualMove(direction) {
  if (journeyMode) {
    if (direction > 0) nextJourneyPhoto();
    else previous();
    return;
  }

  if (!items.length) return;
  clearTimers();

  const chronological = [...items].sort((a, b) => {
    const da = String(a.date || '');
    const db = String(b.date || '');
    return da.localeCompare(db);
  });

  const currentId = items[idx]?.id;
  let currentPosition = chronological.findIndex(item => item.id === currentId);
  if (currentPosition < 0) currentPosition = 0;

  const nextPosition =
    (currentPosition + direction + chronological.length) % chronological.length;
  const target = chronological[nextPosition];
  idx = items.findIndex(item => item.id === target.id);
  if (idx < 0) idx = 0;

  // 수동 이전/다음으로 기록을 바꿀 때 본문 스크롤을 항상 맨 위로 초기화
  const recordScroll = document.querySelector(".record-scroll");
  if (recordScroll) recordScroll.scrollTop = 0;

  render();
}

// 재생 / 일시정지
function togglePause() {

  if (journeyMode ? !journeyPhotos.length : !items.length) return;

  paused = !paused;

  $("pause").textContent = paused ? "▶" : "⏸";
  $("pause").setAttribute("aria-label", paused ? "재생" : "일시정지");
  $("pause").title = paused ? "재생" : "일시정지";

  if (paused) {

    clearTimers();

  } else {

    schedulePlayback();

  }

}

// 사진 스와이프
let touchStartX = 0;

$("media").addEventListener("touchstart", event => {

  touchStartX = event.changedTouches[0].screenX;

}, { passive: true });

$("media").addEventListener("touchend", event => {

  if (currentImages.length <= 6) return;

  const touchEndX = event.changedTouches[0].screenX;

  const diff = touchEndX - touchStartX;

  if (Math.abs(diff) < 60) return;

  if (diff < 0) {

    changePhotoPage(1);

  } else {

    changePhotoPage(-1);

  }

}, { passive: true });

// 확대 모달 터치 스와이프
let lightboxTouchStartX = 0;

$("lightbox").addEventListener("touchstart", event => {

  if (!lightboxOpen) return;

  lightboxTouchStartX = event.changedTouches[0].screenX;

}, { passive: true });

$("lightbox").addEventListener("touchend", event => {

  if (!lightboxOpen || currentImages.length <= 1) return;

  const diff =
    event.changedTouches[0].screenX - lightboxTouchStartX;

  if (Math.abs(diff) < 60) return;

  moveLightbox(diff < 0 ? 1 : -1);

}, { passive: true });

// 데이터 불러오기
async function load() {

  try {

    $("status").textContent = "전체 기록 조회 중...";

    all = await loadAllPages();

    // Notion에 새로 등록된 순서가 아니라 Kidsnote 원본 날짜 기준으로 최신순 정렬
    all.sort((a, b) => {
      const dateA = String(a.date || "").substring(0, 10);
      const dateB = String(b.date || "").substring(0, 10);
      return dateB.localeCompare(dateA);
    });

    $("status").textContent =
      "전체 " + all.length + "개 기록 조회 완료";

    select("추억 랜덤");

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

    $("media").textContent =
      "데이터를 불러오지 못했습니다";

  }

}

// 테마 전환: 사용자가 선택한 모드를 브라우저에 저장
const themeToggle = $("themeToggle");
function applyTheme(isDark) {
  document.body.classList.toggle("dark-mode", isDark);
  if (themeToggle) {
    themeToggle.textContent = isDark ? "☀️ 라이트" : "🌙 다크";
    themeToggle.setAttribute("aria-label", isDark ? "라이트 모드로 전환" : "다크 모드로 전환");
  }
}
let darkModeEnabled = false;
try {
  darkModeEnabled = localStorage.getItem("kidsnoteDashboardTheme") === "dark";
} catch (e) {}
applyTheme(darkModeEnabled);
if (themeToggle) {
  themeToggle.addEventListener("click", () => {
    darkModeEnabled = !darkModeEnabled;
    applyTheme(darkModeEnabled);
    try {
      localStorage.setItem("kidsnoteDashboardTheme", darkModeEnabled ? "dark" : "light");
    } catch (e) {}
  });
}

// 자동 넘김 시간 선택: 선택값을 저장하고 현재 재생에도 즉시 반영
const autoIntervalSelect = $("autoInterval");
if (autoIntervalSelect) {
  autoIntervalSelect.value = String(autoAdvanceSeconds);
  autoIntervalSelect.addEventListener("change", () => {
    const selected = Number(autoIntervalSelect.value);
    if ([10, 15, 20, 30, 45, 60, 90, 120].includes(selected)) {
      autoAdvanceSeconds = selected;
      try {
        localStorage.setItem("kidsnoteAutoAdvanceSeconds", String(selected));
      } catch (e) {}
      schedulePlayback();
    }
  });
}

cinemaRight.append(cinemaInfo, cinemaJourneyContent);
let cinemaActive = false;
let cinemaContentToken = 0;
let cinemaRefreshScheduled = false;

async function refreshCinemaContent() {
  if (!cinemaActive) return;
  const token = ++cinemaContentToken;
  cinemaTitle.textContent = $('title').textContent;
  cinemaMeta.textContent = $('meta').textContent;
  if (!journeyMode || !journeyPhotos.length) {
    cinemaBody.style.display = '';
    cinemaJourneyContent.replaceChildren();
    cinemaJourneyContent.style.display = 'none';
    return;
  }
  cinemaBody.style.display = 'none';
  cinemaJourneyContent.style.display = 'block';
  cinemaJourneyContent.replaceChildren();
  const {start, end} = getJourneyPageBounds();
  const unique = [...new Map(journeyPhotos.slice(start,end).map(p => [p.recordId,p])).values()];
  for (const photo of unique) {
    if (!cinemaActive || token !== cinemaContentToken) return;
    const entry = document.createElement('article');
    entry.className = 'cinema-entry';
    const heading = document.createElement('strong');
    heading.textContent = photo.title || '수하의 추억';
    const date = document.createElement('small');
    date.textContent = (photo.date || '') + ' · ' + (photo.phase || '');
    const content = document.createElement('div');
    content.textContent = '내용 불러오는 중...';
    entry.append(heading,date,content);
    cinemaJourneyContent.appendChild(entry);
    try {
      const detail = await loadDetail(photo.recordId);
      if (!cinemaActive || token !== cinemaContentToken) return;
      content.textContent = detail.text || '기록 내용이 없습니다.';
    } catch(e) {
      if (!cinemaActive || token !== cinemaContentToken) return;
      content.textContent = '기록 내용을 불러오지 못했습니다.';
    }
  }
}
function queueCinemaRefresh() {
  if (!cinemaActive || cinemaRefreshScheduled) return;
  cinemaRefreshScheduled = true;
  queueMicrotask(() => { cinemaRefreshScheduled = false; refreshCinemaContent(); });
}
const cinemaObserver = new MutationObserver(queueCinemaRefresh);
cinemaObserver.observe($('title'), {childList:true, characterData:true, subtree:true});
cinemaObserver.observe($('meta'), {childList:true, characterData:true, subtree:true});
cinemaObserver.observe($('media'), {childList:true});

async function enterCinema() {
  if (cinemaActive) return;
  cinemaActive = true;
  cinemaRight.insertBefore(cinemaBody, cinemaJourneyContent);
  cinemaRecordScroll.appendChild(cinemaRight);
  document.body.classList.add('cinema-mode');
  refreshCinemaContent();
  // 키오스크 브라우저가 Fullscreen API를 막아도 CSS 감상 모드는 작동한다.
  try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch(e) {}
}
async function exitCinema() {
  if (!cinemaActive) return;
  cinemaActive = false;
  ++cinemaContentToken;
  document.body.classList.remove('cinema-mode');
  cinemaOriginalBodyParent.appendChild(cinemaBody);
  cinemaRight.remove();
  cinemaBody.style.display = '';
  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch(e) {}
  }
}
$('cinemaEnter').addEventListener('click', enterCinema);
$('cinemaExit').addEventListener('click', exitCinema);
document.addEventListener('fullscreenchange', () => {
  // Android 뒤로가기 등 브라우저 자체 전체화면 종료와 UI 상태를 맞춘다.
  if (cinemaActive && !document.fullscreenElement) exitCinema();
});

load();

</script>
