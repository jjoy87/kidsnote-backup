<nav id="tabs">

  <button data-cat="공지">공지</button>
</nav>

<main>

<section>
  <div id="media">앨범 불러오는 중...</div>
  <p id="meta"></p>
  <h2 id="title">사랑하는 수하의 소중한 순간</h2>
  <div id="body"></div>
</section>

<aside>
  <h3 id="listTitle">앨범 기록</h3>
  <div id="list">불러오는 중...</div>
</aside>

</main>

<p id="status">노션 연결 대기 중</p>

<div class="controls">
  <button id="prev">이전</button>
  <button id="next">다음</button>
  <button id="pause">일시정지</button>
</div>

<script>

let all = [];
let items = [];

let idx = 0;
let cat = "앨범";

let paused = false;

const $ = id => document.getElementById(id);

function randomIndex(length){
  if(length <= 1) return 0;

  let next;

  do{
    next = Math.floor(Math.random() * length);
  }while(next === idx);

  return next;
}

function render(){

  if(!items.length){
    $("media").textContent = "표시할 기록이 없습니다";
    $("title").textContent = "기록 없음";
    $("meta").textContent = "";
    $("body").textContent = "";
    return;
  }

  const p = items[idx];

  $("title").textContent = p.title || "제목 없음";

  $("meta").textContent =
    [p.date,p.category].filter(Boolean).join(" · ");

  $("body").textContent = p.text || "";

  const media = $("media");
  media.replaceChildren();

  if(p.images && p.images.length){

    const img = document.createElement("img");

    img.src = p.images[0];
    img.alt = p.title || "수하의 앨범 사진";

    media.appendChild(img);

  }else{
    media.textContent = "사진 없음";
  }

  const list = $("list");
  list.replaceChildren();

  items.slice(0,50).forEach((x,i)=>{

    const button = document.createElement("button");

    button.className = "item";
    button.textContent = x.title || "제목 없음";

    button.onclick = ()=>{

      idx = i;
      paused = true;

      $("pause").textContent = "재생";

      render();
    };

    list.appendChild(button);
  });

  $("listTitle").textContent =
    cat === "전체" ? "전체 기록" : cat + " 기록";
}

function select(c){

  cat = c;

  if(c === "전체"){
    items = all;
  }else{
    items = all.filter(x=>x.category === c);
  }

  if(c === "앨범" && items.length){

    idx = Math.floor(Math.random() * items.length);

    paused = false;

    $("pause").textContent = "일시정지";

  }else{

    idx = 0;

    paused = true;

    $("pause").textContent = "재생";
  }

  document.querySelectorAll("nav button").forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.cat === c
    );
  });

  render();

  $("status").textContent =
    c === "앨범"
      ? "앨범 랜덤 재생 중 · " + items.length + "개"
      : c + " 카테고리 · " + items.length + "개";
}

async function load(){

  try{

    $("status").textContent = "노션 데이터 불러오는 중...";

    const response = await fetch("/api/data");

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "API 오류");
    }

    all = data.items || [];

    select(cat);

    $("status").textContent =
      "노션 연결 완료 · 전체 " + all.length + "개 기록";

  }catch(error){

    $("status").textContent =
      "연결 오류: " + error.message;
  }
}

document.querySelectorAll("nav button").forEach(button=>{

  button.onclick = ()=>{
    select(button.dataset.cat);
  };
});

  if(!items.length) return;

  idx = (idx - 1 + items.length) % items.length;

  paused = true;
  $("pause").textContent = "재생";

  render();
};
